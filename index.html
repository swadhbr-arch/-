<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>اتصال مباشر | P2P XO</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #0b0f19; --panel: #151a26; --primary: #00f3ff; --secondary: #ff0055;
            --text-main: #fff; --text-muted: #8892b0; --success: #00ff66;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100%; width: 100%; overflow: hidden; background-color: var(--bg); color: var(--text-main);
            background-image: radial-gradient(circle at center, rgba(0,243,255,0.05) 0%, transparent 60%);
        }

        .app-container {
            position: relative; width: 100%; max-width: 500px; height: 100dvh; 
            margin: 0 auto; display: flex; flex-direction: column;
            background: var(--bg); box-shadow: 0 0 50px rgba(0,0,0,0.8);
            overflow-y: auto;
        }

        /* شريط حقوق المطور */
        .dev-banner {
            background: linear-gradient(90deg, rgba(0,243,255,0.1), rgba(255,0,85,0.1));
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-align: center; padding: 8px; font-size: 0.8rem; font-weight: 700;
            position: sticky; top: 0; z-index: 100;
        }
        .dev-banner span { color: var(--primary); font-size: 0.95rem; text-shadow: 0 0 10px rgba(0,243,255,0.5);}

        /* الشاشات */
        .screen { display: none; flex-direction: column; height: 100%; padding: 20px; }
        .screen.active { display: flex; }

        /* شاشة البداية */
        .title { font-size: 2rem; color: #fff; font-weight: 900; text-align: center; margin-bottom: 20px; }
        
        .card {
            background: var(--panel); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 15px; text-align: center;
        }

        .btn {
            padding: 15px; font-size: 1rem; font-weight: 900; color: #000; background: var(--primary);
            border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px;
        }
        .btn:hover { background: #fff; }
        .btn-outline { background: transparent; color: var(--secondary); border: 2px solid var(--secondary); }

        .input-box {
            width: 100%; height: 100px; background: rgba(0,0,0,0.3); color: #fff;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px;
            font-family: monospace; font-size: 0.8rem; direction: ltr; text-align: left; margin-bottom: 10px; outline: none;
        }

        .status-msg { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px; }

        /* شاشة اللعبة */
        .game-header { display: flex; justify-content: space-between; margin-bottom: 20px; background: var(--panel); padding: 15px; border-radius: 15px;}
        .p-info { display: flex; flex-direction: column; align-items: center; }
        .p-name { font-size: 0.8rem; color: var(--text-muted); font-weight: bold; }
        .p-symbol { font-size: 1.5rem; font-weight: 900; }
        .sym-x { color: var(--primary); }
        .sym-o { color: var(--secondary); }
        .turn-text { font-size: 1rem; font-weight: 900; color: var(--success); align-self: center;}

        .board {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            width: 100%; aspect-ratio: 1/1; background: var(--panel); padding: 10px; border-radius: 15px;
        }
        .cell {
            background: #0b0f19; border-radius: 10px; display: flex; justify-content: center; align-items: center;
            font-size: 3rem; font-weight: 900; cursor: pointer; transition: 0.2s;
        }
        .cell:hover { background: #1e2536; }
        .cell.x { color: var(--primary); text-shadow: 0 0 10px var(--primary); }
        .cell.o { color: var(--secondary); text-shadow: 0 0 10px var(--secondary); }
        .cell.win { background: rgba(0,255,102,0.2); border: 2px solid var(--success); }

        .btn-restart { background: var(--gold); margin-top: 20px; display: none; }
        
        .copy-btn { background: var(--gold); color: #000; margin-top: 10px;}
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="dev-banner">
            تطوير المبدع: <span>عبدالرحيم الجياشي الشمري</span>
        </div>

        <!-- 1. شاشة الاتصال -->
        <div class="screen active" id="setupScreen">
            <div class="title">اتصال مباشر (P2P) ⚡</div>
            
            <!-- الخيارات الأساسية -->
            <div id="mainOptions">
                <button class="btn" id="createHostBtn"><i class="fas fa-broadcast-tower"></i> إنشاء غرفة (أنت المضيف)</button>
                <button class="btn btn-outline" id="joinHostBtn"><i class="fas fa-link"></i> الانضمام لصديق</button>
            </div>

            <!-- واجهة المضيف -->
            <div id="hostUi" class="card" style="display:none;">
                <p class="status-msg">1. انسخ هذا الكود وأرسله لصديقك:</p>
                <textarea id="offerCode" class="input-box" readonly></textarea>
                <button class="btn copy-btn" id="copyOfferBtn"><i class="fas fa-copy"></i> نسخ الكود</button>
                
                <p class="status-msg" style="margin-top:15px;">2. الصق كود الرد الذي أرسله صديقك هنا:</p>
                <textarea id="answerInput" class="input-box" placeholder="الصق كود الرد هنا..."></textarea>
                <button class="btn" id="finishConnectBtn">اتصال</button>
            </div>

            <!-- واجهة المنضم -->
            <div id="joinUi" class="card" style="display:none;">
                <p class="status-msg">1. الصق كود الغرفة الذي أرسله لك صديقك:</p>
                <textarea id="offerInput" class="input-box" placeholder="الصق كود الغرفة هنا..."></textarea>
                <button class="btn" id="processOfferBtn">توليد كود الرد</button>
                
                <div id="answerSection" style="display:none; margin-top:15px;">
                    <p class="status-msg">2. انسخ كود الرد هذا وأرسله لصديقك:</p>
                    <textarea id="myAnswerCode" class="input-box" readonly></textarea>
                    <button class="btn copy-btn" id="copyAnswerBtn"><i class="fas fa-copy"></i> نسخ الكود</button>
                </div>
            </div>
        </div>

        <!-- 2. شاشة اللعب -->
        <div class="screen" id="gameScreen">
            <div class="game-header">
                <div class="p-info">
                    <span class="p-name" id="myName">أنت</span>
                    <span class="p-symbol sym-x" id="mySym">X</span>
                </div>
                <div class="turn-text" id="turnIndicator">جاري الاتصال...</div>
                <div class="p-info">
                    <span class="p-name" id="opName">الخصم</span>
                    <span class="p-symbol sym-o" id="opSym">O</span>
                </div>
            </div>

            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <button class="btn btn-restart" id="restartBtn">جولة جديدة</button>
        </div>

    </div>

    <script>
        // ==========================================
        // إعدادات الاتصال المباشر (WebRTC)
        // ==========================================
        let peerConnection;
        let dataChannel;
        let isHost = false;
        let mySymbol = 'X';
        let currentTurn = 'X';
        let boardState = ["", "", "", "", "", "", "", "", ""];
        let gameActive = false;

        const iceServers = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] // سيرفر مجاني لتجاوز جدران الشبكة
        };

        // العناصر
        const setupScreen = document.getElementById('setupScreen');
        const gameScreen = document.getElementById('gameScreen');
        const turnIndicator = document.getElementById('turnIndicator');
        const restartBtn = document.getElementById('restartBtn');

        // ==========================================
        // 1. واجهة المضيف (إنشاء غرفة)
        // ==========================================
        document.getElementById('createHostBtn').addEventListener('click', async () => {
            isHost = true;
            mySymbol = 'X';
            document.getElementById('mainOptions').style.display = 'none';
            document.getElementById('hostUi').style.display = 'block';

            createPeerConnection();

            // إنشاء قناة بيانات
            dataChannel = peerConnection.createDataChannel('game');
            setupDataChannel();

            // إنشاء عرض الاتصال (Offer)
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            // انتظار جمع معلومات الشبكة (ICE)
            peerConnection.onicecandidate = (event) => {
                if (event.candidate === null) {
                    // تم جمع كل المعلومات، اعرض الكود
                    const code = btoa(JSON.stringify(peerConnection.localDescription));
                    document.getElementById('offerCode').value = code;
                }
            };
        });

        document.getElementById('finishConnectBtn').addEventListener('click', async () => {
            const answerCode = document.getElementById('answerInput').value.trim();
            if (!answerCode) return alert("الرجاء لصق كود الرد أولاً");
            
            try {
                const answerDesc = JSON.parse(atob(answerCode));
                await peerConnection.setRemoteDescription(answerDesc);
                turnIndicator.textContent = "جاري الاتصال...";
            } catch (e) {
                alert("كود الرد غير صحيح!");
            }
        });

        // ==========================================
        // 2. واجهة المنضم (الانضمام لغرفة)
        // ==========================================
        document.getElementById('joinHostBtn').addEventListener('click', () => {
            isHost = false;
            mySymbol = 'O';
            document.getElementById('mainOptions').style.display = 'none';
            document.getElementById('joinUi').style.display = 'block';
        });

        document.getElementById('processOfferBtn').addEventListener('click', async () => {
            const offerCode = document.getElementById('offerInput').value.trim();
            if (!offerCode) return alert("الرجاء لصق كود الغرفة أولاً");

            try {
                const offerDesc = JSON.parse(atob(offerCode));
                createPeerConnection();
                
                // استقبال قناة البيانات
                peerConnection.ondatachannel = (event) => {
                    dataChannel = event.channel;
                    setupDataChannel();
                };

                await peerConnection.setRemoteDescription(offerDesc);
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                // انتظار جمع معلومات الشبكة
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate === null) {
                        const code = btoa(JSON.stringify(peerConnection.localDescription));
                        document.getElementById('myAnswerCode').value = code;
                        document.getElementById('answerSection').style.display = 'block';
                    }
                };
            } catch (e) {
                alert("كود الغرفة غير صحيح!");
            }
        });

        // ==========================================
        // 3. إعداد الاتصال وقناة البيانات
        // ==========================================
        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(iceServers);
            peerConnection.onconnectionstatechange = () => {
                if (peerConnection.connectionState === 'connected') {
                    startGameUI();
                } else if (peerConnection.connectionState === 'disconnected') {
                    alert("انقطع الاتصال بالخصم!");
                    window.location.reload();
                }
            };
        }

        function setupDataChannel() {
            dataChannel.onopen = () => {
                console.log("تم الاتصال!");
                if (isHost) {
                    startGameUI(); // المضيف يبدأ الواجهة
                }
            };

            dataChannel.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                // استقبال حركة الخصم
                if (data.type === 'move') {
                    boardState[data.index] = data.symbol;
                    renderBoard();
                    currentTurn = mySymbol;
                    checkWin();
                    updateTurnText();
                }
                
                // استقبال طلب إعادة اللعب
                if (data.type === 'restart') {
                    resetGameState();
                }
            };
        }

        // ==========================================
        // 4. منطق اللعبة
        // ==========================================
        function startGameUI() {
            setupScreen.classList.remove('active');
            gameScreen.classList.add('active');
            gameActive = true;
            currentTurn = 'X'; // X يبدأ دائماً
            resetGameState();
        }

        function resetGameState() {
            boardState = ["", "", "", "", "", "", "", "", ""];
            currentTurn = 'X';
            gameActive = true;
            renderBoard();
            updateTurnText();
            restartBtn.style.display = 'none';
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('win'));
        }

        document.querySelectorAll('.cell').forEach(cell => {
            cell.addEventListener('click', () => {
                const index = parseInt(cell.getAttribute('data-index'));
                
                // التحقق من الشروط
                if (!gameActive || currentTurn !== mySymbol || boardState[index] !== "") return;

                // تحديث محلي
                boardState[index] = mySymbol;
                renderBoard();
                checkWin();
                
                if (gameActive) {
                    currentTurn = mySymbol === 'X' ? 'O' : 'X';
                    updateTurnText();
                }

                // إرسال للخصم
                dataChannel.send(JSON.stringify({
                    type: 'move',
                    index: index,
                    symbol: mySymbol
                }));
            });
        });

        function renderBoard() {
            document.querySelectorAll('.cell').forEach((cell, index) => {
                cell.textContent = boardState[index];
                cell.className = 'cell'; // تصفير
                if (boardState[index] === 'X') cell.classList.add('x');
                if (boardState[index] === 'O') cell.classList.add('o');
            });
        }

        function updateTurnText() {
            if (!gameActive) return;
            if (currentTurn === mySymbol) {
                turnIndicator.textContent = "دورك الآن!";
                turnIndicator.style.color = "var(--success)";
            } else {
                turnIndicator.textContent = "دور الخصم...";
                turnIndicator.style.color = "var(--text-muted)";
            }
        }

        function checkWin() {
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];

            let winner = null;
            let winPattern = null;

            for (let pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    winner = boardState[a];
                    winPattern = pattern;
                    break;
                }
            }

            if (winner) {
                gameActive = false;
                winPattern.forEach(idx => document.querySelectorAll('.cell')[idx].classList.add('win'));
                
                if (winner === mySymbol) {
                    turnIndicator.textContent = "لقد فزت! 🏆";
                    turnIndicator.style.color = "var(--gold)";
                } else {
                    turnIndicator.textContent = "لقد خسرت! 💀";
                    turnIndicator.style.color = "var(--secondary)";
                }
                restartBtn.style.display = 'block';
            } else if (!boardState.includes("")) {
                // تعادل
                gameActive = false;
                turnIndicator.textContent = "تعادل! 🤝";
                turnIndicator.style.color = "var(--primary)";
                restartBtn.style.display = 'block';
            }
        }

        // إعادة اللعب
        restartBtn.addEventListener('click', () => {
            // إرسال طلب إعادة اللعب للخصم
            dataChannel.send(JSON.stringify({ type: 'restart' }));
            resetGameState();
        });

        // ==========================================
        // 5. أزرار النسخ
        // ==========================================
        document.getElementById('copyOfferBtn').addEventListener('click', () => {
            const ta = document.getElementById('offerCode');
            ta.select();
            document.execCommand('copy');
            alert("تم النسخ! أرسله لصديقك");
        });

        document.getElementById('copyAnswerBtn').addEventListener('click', () => {
            const ta = document.getElementById('myAnswerCode');
            ta.select();
            document.execCommand('copy');
            alert("تم النسخ! أرسله للمضيف");
        });

    </script>
</body>
</html>
