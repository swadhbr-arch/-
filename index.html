<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مبارزة الرياضيات | Math Duel</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg: #05050a; --panel: #12121a;
            --my-color: #00f3ff; --op-color: #ff0055; --gold: #ffcc00;
            --text-muted: #8892b0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100%; width: 100%; overflow: hidden; background-color: var(--bg); color: #fff;
            background-image: radial-gradient(circle at center, rgba(0,243,255,0.05) 0%, transparent 60%);
        }

        .app-container {
            position: relative; width: 100%; max-width: 500px; height: 100dvh; 
            margin: 0 auto; display: flex; flex-direction: column;
            background: var(--bg); box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* شريط حقوق المطور */
        .dev-banner {
            background: linear-gradient(90deg, rgba(0,243,255,0.1), rgba(255,0,85,0.1));
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-align: center; padding: 8px; font-size: 0.8rem; font-weight: 700;
            z-index: 10; flex-shrink: 0;
        }
        .dev-banner span { color: var(--my-color); font-size: 0.95rem; text-shadow: 0 0 10px rgba(0,243,255,0.5);}

        /* ===== الشاشات ===== */
        .screen { display: none; flex-direction: column; flex: 1; height: 100%; overflow-y: auto; }
        .screen.active { display: flex; }

        /* ===== 1. شاشة الدخول ===== */
        #authScreen { padding: 20px; justify-content: center; align-items: center; }
        .login-card {
            width: 100%; background: var(--panel); padding: 25px 20px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08); text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .title { font-size: 2rem; color: #fff; font-weight: 900; margin-bottom: 5px; }
        .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }

        .input-group { margin-bottom: 12px; text-align: right; }
        .input-group label { display: block; color: #ccc; margin-bottom: 5px; font-weight: 700; font-size: 0.8rem;}
        .input-group input {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3); color: #fff; font-size: 1rem; outline: none; text-align: center;
        }

        .btn {
            padding: 12px; font-size: 1rem; font-weight: 900; color: #000; background: var(--my-color);
            border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:hover { background: #fff; box-shadow: 0 0 15px var(--my-color); }
        .btn-outline { background: transparent; color: var(--op-color); border: 2px solid var(--op-color); margin-top: 10px;}

        /* ===== 2. شاشة الانتظار ===== */
        #lobbyScreen { justify-content: center; align-items: center; text-align: center; padding: 20px;}
        .room-code { font-size: 3rem; font-weight: 900; color: var(--gold); letter-spacing: 8px; margin: 15px 0; text-shadow: 0 0 20px rgba(255,204,0,0.4);}
        .wait-text { color: var(--text-muted); font-size: 0.95rem; animation: pulse 1.5s infinite alternate;}
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

        /* ===== 3. شاشة اللعب ===== */
        #gameScreen { background: #000; display: none; flex-direction: column; height: 100%; padding: 15px; overflow: hidden;}
        #gameScreen.active { display: flex; }

        /* الهيدر */
        .game-header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--panel); padding: 15px; border-radius: 15px; margin-bottom: 20px; flex-shrink: 0;
        }
        .p-info { display: flex; flex-direction: column; align-items: center; }
        .p-name { font-size: 0.9rem; font-weight: 700; }
        .p-score { font-size: 1.8rem; font-weight: 900; }
        .p1-color { color: var(--my-color); text-shadow: 0 0 10px var(--my-color); }
        .p2-color { color: var(--op-color); text-shadow: 0 0 10px var(--op-color); }
        .vs-text { font-size: 1.2rem; color: var(--gold); font-weight: 900; }

        /* منطقة السؤال */
        .question-area {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(255,255,255,0.02); border-radius: 20px; padding: 20px;
            border: 1px solid rgba(255,255,255,0.05); margin-bottom: 20px;
        }
        .question-text { font-size: 4rem; font-weight: 900; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.3); margin-bottom: 20px;}
        .question-status { font-size: 1.2rem; font-weight: 700; color: var(--gold);}

        /* شبكة الخيارات */
        .options-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%;
        }
        .option-btn {
            padding: 20px; font-size: 1.8rem; font-weight: 900; color: #fff;
            background: var(--panel); border: 2px solid rgba(255,255,255,0.1);
            border-radius: 15px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .option-btn:active { transform: scale(0.95); }
        .option-btn.correct { background: #00ff66; color: #000; border-color: #00ff66; }
        .option-btn.wrong { background: var(--op-color); color: #fff; border-color: var(--op-color); }
        .option-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* شاشة الفائز باللعبة */
        .winner-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .winner-overlay.show { opacity: 1; pointer-events: auto; }
        .winner-title { font-size: 2.5rem; font-weight: 900; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="dev-banner">
            تطوير المبدع: <span>عبدالرحيم الجياشي الشمري</span>
        </div>

        <!-- 1. شاشة الدخول -->
        <div class="screen active" id="authScreen">
            <div class="login-card">
                <div class="title">مبارزة الرياضيات ⚔️</div>
                <div class="subtitle">من يملك العقل الأسرع؟</div>
                
                <div class="input-group">
                    <label>اسمك:</label>
                    <input type="text" id="playerName" placeholder="اكتب اسمك..." maxlength="15">
                </div>
                
                <button class="btn" id="createRoomBtn"><i class="fas fa-plus"></i> إنشاء غرفة</button>
                
                <div style="text-align: center; margin: 10px 0; color: #555; font-weight:bold;">- أو -</div>
                
                <div class="input-group">
                    <label>كود الغرفة (للدخول):</label>
                    <input type="text" id="roomCodeInput" placeholder="مثال: A7B2" style="text-transform: uppercase;" maxlength="6">
                </div>
                <button class="btn btn-outline" id="joinRoomBtn"><i class="fas fa-sign-in-alt"></i> دخول الغرفة</button>
            </div>
        </div>

        <!-- 2. شاشة الانتظار -->
        <div class="screen" id="lobbyScreen">
            <h2 style="color: #fff; margin-bottom: 10px;">غرفة الانتظار</h2>
            <div class="room-code" id="displayRoomCode">----</div>
            <p class="wait-text" id="waitMsg">بانتظار انضمام الخصم...</p>
        </div>

        <!-- 3. شاشة اللعب -->
        <div class="screen" id="gameScreen">
            
            <!-- الهيدر -->
            <div class="game-header">
                <div class="p-info">
                    <span class="p-name p2-color" id="opName">الخصم</span>
                    <span class="p-score p2-color" id="opScore">0</span>
                </div>
                <div class="vs-text">VS</div>
                <div class="p-info">
                    <span class="p-name p1-color" id="myName">أنت</span>
                    <span class="p-score p1-color" id="myScore">0</span>
                </div>
            </div>

            <!-- السؤال -->
            <div class="question-area">
                <div class="question-text" id="questionText">جاري التحميل...</div>
                <div class="question-status" id="questionStatus">استعد!</div>
            </div>

            <!-- الخيارات -->
            <div class="options-grid" id="optionsGrid">
                <button class="option-btn" onclick="submitAnswer(0)">-</button>
                <button class="option-btn" onclick="submitAnswer(1)">-</button>
                <button class="option-btn" onclick="submitAnswer(2)">-</button>
                <button class="option-btn" onclick="submitAnswer(3)">-</button>
            </div>

            <!-- شاشة الفائز -->
            <div class="winner-overlay" id="winnerOverlay">
                <div class="winner-title" id="winnerTitle">لقد فزت! 🏆</div>
                <button class="btn" id="closeOverlayBtn" style="width: 200px;">العودة للغرفة</button>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // 1. إعدادات Firebase
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBQa9TnbuCCPqfnXY-T9t-uwag0J2WEnFI",
            authDomain: "arrahimm.firebaseapp.com",
            databaseURL: "https://arrahimm-default-rtdb.firebaseio.com/",
            projectId: "arrahimm",
            storageBucket: "arrahimm.firebasestorage.app",
            messagingSenderId: "150237867312",
            appId: "1:150237867312:web:364d67877f9ff4d2bbacf5"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        // ==========================================
        // 2. المتغيرات
        // ==========================================
        let myId = 'player_' + Math.floor(Math.random() * 10000);
        let myName = "";
        let currentRoom = "";
        let roomData = {};
        let myRole = ""; 
        let hasAnsweredThisRound = false;
        const WIN_POINTS = 5;

        // العناصر
        const authScreen = document.getElementById('authScreen');
        const lobbyScreen = document.getElementById('lobbyScreen');
        const gameScreen = document.getElementById('gameScreen');
        const winnerOverlay = document.getElementById('winnerOverlay');
        const questionText = document.getElementById('questionText');
        const questionStatus = document.getElementById('questionStatus');
        const optionsBtns = document.querySelectorAll('.option-btn');

        // الأصوات
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            if(type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            } else if(type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            } else if(type === 'win') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            }

            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        // ==========================================
        // 3. إنشاء ودخول الغرف
        // ==========================================
        document.getElementById('createRoomBtn').addEventListener('click', () => {
            myName = document.getElementById('playerName').value.trim();
            if (!myName) return alert("الرجاء كتابة اسمك أولاً");
            
            const code = Math.random().toString(36).substring(2, 6).toUpperCase();
            currentRoom = code;
            myRole = 'p1';
            
            db.ref('math_duel/' + code).set({
                host: myId,
                status: 'waiting',
                players: { 
                    p1: { name: myName, score: 0 },
                    p2: null 
                },
                question: null,
                roundWinner: null
            }).then(() => enterLobby());
        });

        document.getElementById('joinRoomBtn').addEventListener('click', () => {
            myName = document.getElementById('playerName').value.trim();
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if (!myName) return alert("الرجاء كتابة اسمك أولاً");
            if (!code) return alert("الرجاء كتابة كود الغرفة");

            currentRoom = code;
            myRole = 'p2';
            
            db.ref('math_duel/' + code).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    db.ref(`math_duel/${code}/players/p2`).set({ name: myName, score: 0 });
                    enterLobby();
                } else {
                    alert("الغرفة غير موجودة.");
                }
            });
        });

        function enterLobby() {
            authScreen.classList.remove('active');
            lobbyScreen.classList.add('active');
            document.getElementById('displayRoomCode').textContent = currentRoom;
            listenToRoom();
        }

        // ==========================================
        // 4. الاستماع للغرفة
        // ==========================================
        function listenToRoom() {
            db.ref('math_duel/' + currentRoom).on('value', (snapshot) => {
                roomData = snapshot.val();
                if (!roomData) return;

                // بدء اللعب عند دخول شخصين
                if (roomData.status === 'waiting' && roomData.players.p2) {
                    db.ref(`math_duel/${currentRoom}`).update({ status: 'playing' });
                }

                if (roomData.status === 'playing') {
                    if (!gameScreen.classList.contains('active')) {
                        lobbyScreen.classList.remove('active');
                        gameScreen.classList.add('active');
                    }
                    updateGameState();
                }
            });
        }

        // ==========================================
        // 5. تحديث واجهة اللعب
        // ==========================================
        function updateGameState() {
            document.getElementById('myName').textContent = roomData.players[myRole].name;
            document.getElementById('myScore').textContent = roomData.players[myRole].score;
            const opRole = myRole === 'p1' ? 'p2' : 'p1';
            document.getElementById('opName').textContent = roomData.players[opRole].name;
            document.getElementById('opScore').textContent = roomData.players[opRole].score;

            // إذا لم يكن هناك سؤال، المضيف يصنع واحداً
            if (!roomData.question && !roomData.roundWinner) {
                if (roomData.host === myId) generateQuestion();
                return;
            }

            // عرض السؤال
            if (roomData.question) {
                questionText.textContent = roomData.question.text;
                optionsBtns.forEach((btn, index) => {
                    btn.textContent = roomData.question.options[index];
                    btn.className = 'option-btn'; // إعادة تصفير الحالة
                    btn.disabled = false;
                });
            }

            // إذا كان هناك فائز بالجولة
            if (roomData.roundWinner) {
                hasAnsweredThisRound = true;
                optionsBtns.forEach(btn => btn.disabled = true);
                
                const winner = roomData.roundWinner;
                if (winner === myRole) {
                    playSound('correct');
                    questionStatus.textContent = "أحسنت! نقطة لك 🎉";
                    questionStatus.style.color = "var(--my-color)";
                    if(navigator.vibrate) navigator.vibrate(100);
                } else if (winner === opRole) {
                    playSound('wrong');
                    questionStatus.textContent = "الخصم أسرع! 💨";
                    questionStatus.style.color = "var(--op-color)";
                } else if (winner === 'draw') {
                    questionStatus.textContent = "تعادل! لم يجب أحد 💤";
                    questionStatus.style.color = "var(--gold)";
                } else if (winner === 'wrong') {
                    // شخص أجاب خطأ
                    questionStatus.textContent = "إجابة خاطئة! ⛔";
                    questionStatus.style.color = "var(--op-color)";
                }

                // التحقق من الفوز باللعبة
                if (roomData.players.p1.score >= WIN_POINTS || roomData.players.p2.score >= WIN_POINTS) {
                    showGameWinner();
                } else {
                    // الانتقال لسؤال جديد (المضيف فقط)
                    if (roomData.host === myId) {
                        setTimeout(() => {
                            db.ref(`math_duel/${currentRoom}`).update({
                                question: null,
                                roundWinner: null
                            });
                        }, 2000);
                    }
                }
            } else {
                hasAnsweredThisRound = false;
                questionStatus.textContent = "من سيجيب أولاً؟";
                questionStatus.style.color = "var(--gold)";
            }
        }

        // ==========================================
        // 6. صنع الأسئلة (للمضيف)
        // ==========================================
        function generateQuestion() {
            const ops = ['+', '-', '*'];
            const op = ops[Math.floor(Math.random() * ops.length)];
            let num1, num2, answer;

            if (op === '+') {
                num1 = Math.floor(Math.random() * 50) + 10;
                num2 = Math.floor(Math.random() * 50) + 10;
                answer = num1 + num2;
            } else if (op === '-') {
                num1 = Math.floor(Math.random() * 50) + 20;
                num2 = Math.floor(Math.random() * 20) + 5;
                answer = num1 - num2;
            } else {
                num1 = Math.floor(Math.random() * 10) + 2;
                num2 = Math.floor(Math.random() * 10) + 2;
                answer = num1 * num2;
            }

            const text = `${num1} ${op} ${num2}`;
            
            // توليد خيارات خاطئة
            let options = [answer];
            while (options.length < 4) {
                let wrong = answer + Math.floor(Math.random() * 20) - 10;
                if (wrong !== answer && wrong > 0 && !options.includes(wrong)) {
                    options.push(wrong);
                }
            }
            // خلط الخيارات
            options.sort(() => Math.random() - 0.5);
            const correctIndex = options.indexOf(answer);

            db.ref(`math_duel/${currentRoom}`).update({
                question: {
                    text: text,
                    answer: answer,
                    options: options,
                    correctIndex: correctIndex
                }
            });

            // مؤقت 7 ثواني (إذا لم يجب أحد، ينتهي السؤال)
            setTimeout(() => {
                db.ref(`math_duel/${currentRoom}`).once('value').then(snap => {
                    const data = snap.val();
                    if (data && !data.roundWinner) {
                        db.ref(`math_duel/${currentRoom}/roundWinner`).set('draw');
                    }
                });
            }, 7000);
        }

        // ==========================================
        // 7. الإجابة
        // ==========================================
        function submitAnswer(index) {
            if (hasAnsweredThisRound || roomData.roundWinner) return;
            
            const isCorrect = (index === roomData.question.correctIndex);

            if (isCorrect) {
                // استخدام Transaction لضمان أن أول شخص ضغط هو من يأخذ النقطة
                db.ref(`math_duel/${currentRoom}/roundWinner`).transaction((currentWinner) => {
                    if (currentWinner === null) {
                        return myRole; // لقد فزت بالجولة
                    }
                    return currentWinner; // شخص آخر فاز
                });
            } else {
                // إجابة خاطئة، يتم تجميد اللاعب
                playSound('wrong');
                optionsBtns[index].classList.add('wrong');
                optionsBtns[index].disabled = true;
                
                // إذا أخطأ اللاعب، لا يمكنه النقر مجدداً. 
                // ولكن لا ننهي الجولة إلا إذا ضغط الخصم إجابة صحيحة أو انتهى الوقت.
            }
        }

        // ==========================================
        // 8. شاشة الفائز باللعبة
        // ==========================================
        function showGameWinner() {
            winnerOverlay.classList.add('show');
            const title = document.getElementById('winnerTitle');
            const isWinner = (roomData.players[myRole].score >= WIN_POINTS);
            
            if (isWinner) {
                title.textContent = "لقد فزت باللعبة! 🏆";
                title.className = "winner-title win-color";
                playSound('win');
                if(navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
            } else {
                title.textContent = "لقد خسرت! 💀";
                title.className = "winner-title lose-color";
            }
        }

        document.getElementById('closeOverlayBtn').addEventListener('click', () => {
            winnerOverlay.classList.remove('show');
            
            if (roomData.host === myId) {
                db.ref('math_duel/' + currentRoom).update({
                    status: 'waiting',
                    question: null,
                    roundWinner: null,
                    'players/p1/score': 0,
                    'players/p2/score': 0
                });
            } else {
                gameScreen.classList.remove('active');
                lobbyScreen.classList.add('active');
            }
        });

    </script>
</body>
</html>
