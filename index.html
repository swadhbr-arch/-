<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>صراع الروبوتات 3D | 3D Robot Duel</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة Three.js للرسومات ثلاثية الأبعاد -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- مكتبة Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg: #05050a; --panel: rgba(18, 18, 26, 0.85);
            --my-color: #00f3ff; --op-color: #ff0055; --gold: #ffcc00;
            --text-muted: #8892b0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100%; width: 100%; overflow: hidden; background-color: var(--bg); color: #fff;
        }

        /* حاوية الرسم 3D */
        #canvas-container {
            position: absolute; inset: 0; z-index: 1;
        }

        /* واجهة المستخدم (HUD) */
        .ui-layer {
            position: absolute; inset: 0; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; padding: 15px;
        }

        .app-container {
            position: relative; width: 100%; max-width: 600px; height: 100dvh; 
            margin: 0 auto; display: flex; flex-direction: column; overflow: hidden;
        }

        /* شاشة الدخول */
        .screen { display: none; flex-direction: column; height: 100%; padding: 20px; pointer-events: auto; justify-content: center; align-items: center; background: var(--bg); z-index: 100; position: absolute; inset: 0;}
        .screen.active { display: flex; }

        .login-card {
            width: 100%; background: var(--panel); padding: 25px 20px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1); text-align: center;
            backdrop-filter: blur(10px);
        }
        .title { font-size: 2rem; color: #fff; font-weight: 900; margin-bottom: 5px; text-shadow: 0 0 15px var(--my-color);}
        .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }

        .input-group { margin-bottom: 12px; text-align: right; }
        .input-group label { display: block; color: #ccc; margin-bottom: 5px; font-weight: 700; font-size: 0.8rem;}
        .input-group input {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.5); color: #fff; font-size: 1rem; outline: none; text-align: center;
        }

        .btn {
            padding: 12px; font-size: 1rem; font-weight: 900; color: #000; background: var(--my-color);
            border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px; pointer-events: auto;
        }
        .btn:hover { background: #fff; box-shadow: 0 0 15px var(--my-color); }
        .btn-outline { background: transparent; color: var(--op-color); border: 2px solid var(--op-color); margin-top: 10px;}

        /* شاشة الانتظار */
        .room-code { font-size: 3rem; font-weight: 900; color: var(--gold); letter-spacing: 8px; margin: 15px 0; text-shadow: 0 0 20px var(--gold);}

        /* شريط الصحة */
        .health-bars { display: flex; justify-content: space-between; margin-bottom: auto;}
        .hp-box { width: 45%; }
        .hp-header { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: bold; margin-bottom: 5px; text-shadow: 0 0 5px #000;}
        .hp-bar-bg { width: 100%; height: 12px; background: rgba(0,0,0,0.6); border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2);}
        .hp-bar-fill { height: 100%; transition: width 0.3s ease; }
        .my-hp .hp-bar-fill { background: var(--my-color); box-shadow: 0 0 10px var(--my-color); float: right;}
        .op-hp .hp-bar-fill { background: var(--op-color); box-shadow: 0 0 10px var(--op-color); float: left;}

        /* سجل المعركة */
        .battle-log {
            background: rgba(0,0,0,0.7); padding: 10px; border-radius: 10px; text-align: center;
            font-weight: bold; color: var(--gold); font-size: 0.9rem; margin-top: auto;
            border: 1px solid rgba(255, 204, 0, 0.3); backdrop-filter: blur(5px);
        }

        /* أزرار التحكم */
        .controls { display: flex; gap: 10px; margin-top: 15px; pointer-events: auto;}
        .action-btn {
            flex: 1; background: var(--panel); border: 2px solid rgba(255,255,255,0.2); border-radius: 12px;
            padding: 12px 5px; display: flex; flex-direction: column; align-items: center; gap: 5px;
            cursor: pointer; color: #fff; font-weight: bold; backdrop-filter: blur(5px);
        }
        .action-btn i { font-size: 1.5rem; }
        .action-btn span { font-size: 0.8rem; }
        .action-btn:disabled { opacity: 0.3; filter: grayscale(1); }
        .btn-laser i { color: var(--my-color); }
        .btn-missile i { color: var(--op-color); }
        .btn-heal i { color: #00ff66; }

        /* الدردشة */
        .chat-toggle {
            position: absolute; bottom: 20px; left: 20px; width: 45px; height: 45px;
            background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: #000; cursor: pointer; pointer-events: auto; z-index: 100;
            box-shadow: 0 0 15px rgba(255,204,0,0.5);
        }
        .chat-box {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: rgba(10, 15, 25, 0.95);
            border-top: 2px solid var(--my-color); display: flex; flex-direction: column;
            transform: translateY(100%); transition: transform 0.3s; z-index: 99; pointer-events: auto;
            backdrop-filter: blur(10px);
        }
        .chat-box.open { transform: translateY(0); }
        .chat-header { padding: 10px 15px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; font-weight: bold;}
        .chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .msg { padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; max-width: 80%; }
        .msg.me { background: var(--my-color); color: #000; align-self: flex-end; }
        .msg.other { background: #334155; color: #fff; align-self: flex-start; }
        .chat-input { padding: 10px; display: flex; gap: 5px; }
        .chat-input input { flex: 1; padding: 8px; border-radius: 20px; border: none; background: #1e293b; color: #fff; outline: none; }
        .chat-input button { background: var(--my-color); border: none; width: 35px; border-radius: 50%; color: #000;}

        /* شاشة الفائز */
        .winner-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; pointer-events: auto;
        }
        .winner-overlay.show { opacity: 1; pointer-events: auto; }
        .winner-title { font-size: 3rem; font-weight: 900; margin-bottom: 20px; }
        .win-color { color: var(--my-color); text-shadow: 0 0 20px var(--my-color); }
        .lose-color { color: var(--op-color); text-shadow: 0 0 20px var(--op-color); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- حاوية 3D -->
        <div id="canvas-container"></div>

        <!-- طبقة الواجهة -->
        <div class="ui-layer">
            <!-- أشرطة الصحة -->
            <div class="health-bars" id="hud" style="display: none;">
                <div class="hp-box op-hp">
                    <div class="hp-header"><span id="opName" style="color: var(--op-color)">الخصم</span> <span id="opHpText">100</span></div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill" id="opHpBar" style="width: 100%"></div></div>
                </div>
                <div class="hp-box my-hp">
                    <div class="hp-header"><span id="myName" style="color: var(--my-color)">أنت</span> <span id="myHpText">100</span></div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill" id="myHpBar" style="width: 100%"></div></div>
                </div>
            </div>

            <div class="battle-log" id="battleLog" style="display: none;">استعد للمعركة...</div>

            <div class="controls" id="controls" style="display: none;">
                <button class="action-btn btn-laser" onclick="performAction('laser')">
                    <i class="fas fa-bolt"></i> <span>ليزر</span>
                </button>
                <button class="action-btn btn-missile" onclick="performAction('missile')">
                    <i class="fas fa-rocket"></i> <span>صاروخ</span>
                </button>
                <button class="action-btn btn-heal" onclick="performAction('heal')">
                    <i class="fas fa-wrench"></i> <span>إصلاح</span>
                </button>
            </div>
        </div>

        <!-- الدردشة -->
        <div class="chat-toggle" id="chatToggle" style="display: none;"><i class="fas fa-comment"></i></div>
        <div class="chat-box" id="chatBox">
            <div class="chat-header"><span>الدردشة</span> <i class="fas fa-times" id="closeChat" style="cursor:pointer"></i></div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="اكتب رسالة...">
                <button id="sendChatBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- شاشات الدخول والانتظار -->
        <div class="screen active" id="authScreen">
            <div class="login-card">
                <div class="title">صراع الروبوتات 3D 🤖</div>
                <div class="subtitle">معركة تكتيكية بالرسومات ثلاثية الأبعاد</div>
                
                <div class="input-group">
                    <label>اسمك:</label>
                    <input type="text" id="playerName" placeholder="اكتب اسمك..." maxlength="15">
                </div>
                
                <button class="btn" id="createRoomBtn"><i class="fas fa-plus"></i> إنشاء غرفة</button>
                <div style="text-align: center; margin: 10px 0; color: #555; font-weight:bold;">- أو -</div>
                
                <div class="input-group">
                    <label>كود الغرفة:</label>
                    <input type="text" id="roomCodeInput" placeholder="مثال: A7B2" style="text-transform: uppercase;" maxlength="6">
                </div>
                <button class="btn btn-outline" id="joinRoomBtn"><i class="fas fa-sign-in-alt"></i> دخول المعركة</button>
            </div>
        </div>

        <div class="screen" id="lobbyScreen">
            <h2 style="color: #fff;">غرفة المعركة 3D</h2>
            <div class="room-code" id="displayRoomCode">----</div>
            <p style="color: var(--text-muted); animation: pulse 1.5s infinite alternate;">بانتظار الخصم...</p>
        </div>

        <!-- شاشة الفائز -->
        <div class="winner-overlay" id="winnerOverlay">
            <div class="winner-title" id="winnerTitle">لقد فزت! 🏆</div>
            <button class="btn" id="closeOverlayBtn" style="width: 200px;">العودة للغرفة</button>
        </div>

    </div>

    <script>
        // ==========================================
        // 1. إعدادات Firebase
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBQa9TnbuCCPqfnXY-T9t-uwag0J2WEnFI",
            authDomain: "arrahimm.firebaseapp.com",
            databaseURL: "https://arrahimm-default-rtdb.firebaseio.com/",
            projectId: "arrahimm",
            storageBucket: "arrahimm.firebasestorage.app",
            messagingSenderId: "150237867312",
            appId: "1:150237867312:web:364d67877f9ff4d2bbacf5"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        // ==========================================
        // 2. إعداد المشهد 3D (Three.js)
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05050a, 0.05); // ضباب خفيف في الخلفية

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 12); // كاميرا علوية
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // أرضية الساحة
        const gridHelper = new THREE.GridHelper(20, 20, 0x00f3ff, 0x1e293b);
        scene.add(gridHelper);

        // مجسمات الروبوتات (مكعبات نيون)
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        
        // روبوت اللاعب (أزرق)
        const matP1 = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x00f3ff, emissiveIntensity: 0.5 });
        const robotP1 = new THREE.Mesh(geometry, matP1);
        robotP1.position.set(-4, 1, 0);
        scene.add(robotP1);

        // روبوت الخصم (أحمر)
        const matP2 = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.5 });
        const robotP2 = new THREE.Mesh(geometry, matP2);
        robotP2.position.set(4, 1, 0);
        scene.add(robotP2);

        // أشعة الليزر (مخفية مبدئياً)
        const laserMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
        const laserGeo = new THREE.CylinderGeometry(0.1, 0.1, 8, 8);
        const laserBeam = new THREE.Mesh(laserGeo, laserMat);
        laserBeam.rotation.z = Math.PI / 2; // أفقي
        laserBeam.position.set(0, 1, 0);
        laserBeam.visible = false;
        scene.add(laserBeam);

        // أنيميشن 3D
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.05;
            
            // حركة طفو للروبوتات
            robotP1.position.y = 1 + Math.sin(time) * 0.2;
            robotP1.rotation.y = Math.sin(time * 0.5) * 0.2;

            robotP2.position.y = 1 + Math.cos(time) * 0.2;
            robotP2.rotation.y = -Math.sin(time * 0.5) * 0.2;

            renderer.render(scene, camera);
        }
        animate();

        // تحديث حجم الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // ==========================================
        // 3. المتغيرات ومنطق اللعبة
        // ==========================================
        let myId = 'player_' + Math.floor(Math.random() * 10000);
        let myName = "";
        let currentRoom = "";
        let roomData = {};
        let myRole = ""; 
        let lastLogProcessed = "";
        let lastMessageCount = 0;

        // الأصوات
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            if(type === 'laser') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            } else if(type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            }
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        // ==========================================
        // 4. إنشاء ودخول الغرف
        // ==========================================
        document.getElementById('createRoomBtn').addEventListener('click', () => {
            myName = document.getElementById('playerName').value.trim();
            if (!myName) return alert("الرجاء كتابة اسمك أولاً");
            const code = Math.random().toString(36).substring(2, 6).toUpperCase();
            currentRoom = code;
            myRole = 'p1';
            
            db.ref('fights3d/' + code).set({
                host: myId,
                status: 'waiting',
                p1_hp: 100, p2_hp: 100,
                turn: 'p1',
                players: { p1: { name: myName }, p2: null },
                lastLog: "استعد للمعركة! ⚔️",
                winner: null
            }).then(() => enterLobby());
        });

        document.getElementById('joinRoomBtn').addEventListener('click', () => {
            myName = document.getElementById('playerName').value.trim();
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if (!myName) return alert("الرجاء كتابة اسمك أولاً");
            if (!code) return alert("الرجاء كتابة كود الغرفة");
            currentRoom = code;
            myRole = 'p2';
            
            db.ref('fights3d/' + code).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    db.ref(`fights3d/${code}/players/p2`).set({ name: myName });
                    enterLobby();
                } else alert("الغرفة غير موجودة.");
            });
        });

        function enterLobby() {
            document.getElementById('authScreen').classList.remove('active');
            document.getElementById('lobbyScreen').classList.add('active');
            document.getElementById('displayRoomCode').textContent = currentRoom;
            listenToRoom();
        }

        // ==========================================
        // 5. الاستماع للغرفة وتحديث المشهد
        // ==========================================
        function listenToRoom() {
            db.ref('fights3d/' + currentRoom).on('value', (snapshot) => {
                roomData = snapshot.val();
                if (!roomData) return;

                if (roomData.status === 'waiting' && roomData.players.p2) {
                    db.ref(`fights3d/${currentRoom}`).update({ status: 'playing' });
                }

                if (roomData.status === 'playing' || roomData.status === 'finished') {
                    if (document.getElementById('lobbyScreen').classList.contains('active')) {
                        document.getElementById('lobbyScreen').classList.remove('active');
                        // إظهار عناصر اللعبة
                        document.getElementById('hud').style.display = 'flex';
                        document.getElementById('battleLog').style.display = 'block';
                        document.getElementById('controls').style.display = 'flex';
                        document.getElementById('chatToggle').style.display = 'flex';
                    }
                    updateUI();
                    renderChat();
                    processCombatAnimation();
                }
            });
        }

        // ==========================================
        // 6. تحديث واجهة المستخدم
        // ==========================================
        function updateUI() {
            const me = roomData.players[myRole];
            const opRole = myRole === 'p1' ? 'p2' : 'p1';
            const op = roomData.players[opRole];

            if (!me || !op) return;

            document.getElementById('myName').textContent = me.name;
            document.getElementById('opName').textContent = op.name;

            let myHp = Math.max(0, roomData[`${myRole}_hp`]);
            let opHp = Math.max(0, roomData[`${opRole}_hp`]);

            document.getElementById('myHpText').textContent = myHp;
            document.getElementById('opHpText').textContent = opHp;
            document.getElementById('myHpBar').style.width = `${myHp}%`;
            document.getElementById('opHpBar').style.width = `${opHp}%`;

            document.getElementById('battleLog').textContent = roomData.lastLog || "المعركة مستمرة...";

            // التحكم بالأزرار
            const isMyTurn = (roomData.turn === myRole);
            const btns = document.querySelectorAll('.action-btn');
            
            if (roomData.winner) {
                btns.forEach(b => b.disabled = true);
                if (!document.getElementById('winnerOverlay').classList.contains('show')) {
                    document.getElementById('winnerOverlay').classList.add('show');
                    const isWinner = (roomData.winner === myRole);
                    document.getElementById('winnerTitle').textContent = isWinner ? "لقد فزت! 🏆" : "لقد خسرت! 💀";
                    document.getElementById('winnerTitle').className = `winner-title ${isWinner ? 'win-color' : 'lose-color'}`;
                    if(isWinner) playSound('hit');
                }
            } else {
                btns.forEach(b => b.disabled = !isMyTurn);
            }
        }

        // ==========================================
        // 7. تنفيذ الحركات
        // ==========================================
        function performAction(action) {
            if (roomData.turn !== myRole || roomData.winner) return;

            const opRole = myRole === 'p1' ? 'p2' : 'p1';
            let myHp = roomData[`${myRole}_hp`];
            let opHp = roomData[`${opRole}_hp`];
            let logMsg = "";
            let updates = {};

            if (action === 'laser') {
                let dmg = Math.floor(Math.random() * 10) + 10; // 10-19
                opHp = Math.max(0, opHp - dmg);
                updates[`${opRole}_hp`] = opHp;
                logMsg = `أطلق ${roomData.players[myRole].name} شعاع ليزر! ⚡ (-${dmg} HP)`;
            } else if (action === 'missile') {
                let miss = Math.random() < 0.3;
                if (miss) {
                    logMsg = `أطلق ${roomData.players[myRole].name} صاروخاً لكنه أخطأ! 💨`;
                } else {
                    let dmg = Math.floor(Math.random() * 21) + 20; // 20-40
                    opHp = Math.max(0, opHp - dmg);
                    updates[`${opRole}_hp`] = opHp;
                    logMsg = `أطلق ${roomData.players[myRole].name} صاروخاً مدمراً! 🚀 (-${dmg} HP)`;
                }
            } else if (action === 'heal') {
                let heal = Math.floor(Math.random() * 15) + 15; // 15-29
                myHp = Math.min(100, myHp + heal);
                updates[`${myRole}_hp`] = myHp;
                logMsg = `أصلح ${roomData.players[myRole].name} روبوته! 🔧 (+${heal} HP)`;
            }

            updates['turn'] = opRole;
            updates['lastLog'] = logMsg;

            if (opHp <= 0) {
                updates['winner'] = myRole;
                updates['status'] = 'finished';
            }

            db.ref('fights3d/' + currentRoom).update(updates);
        }

        // ==========================================
        // 8. تأثيرات الرسوم المتحركة 3D
        // ==========================================
        function processCombatAnimation() {
            if (roomData.lastLog !== lastLogProcessed) {
                lastLogProcessed = roomData.lastLog;

                // إذا كان هناك هجوم
                if (roomData.lastLog.includes('ليزر')) {
                    playSound('laser');
                    
                    // تحديد اتجاه الليزر
                    const isP1Attacker = roomData.lastLog.includes(roomData.players.p1.name);
                    const attackerX = isP1Attacker ? robotP1.position.x : robotP2.position.x;
                    const defenderX = isP1Attacker ? robotP2.position.x : robotP1.position.x;
                    
                    laserBeam.position.x = (attackerX + defenderX) / 2;
                    laserBeam.material.color.setHex(isP1Attacker ? 0x00f3ff : 0xff0055);
                    laserBeam.visible = true;

                    // تأثير اهتزاز الروبوت المتضرر
                    const targetRobot = isP1Attacker ? robotP2 : robotP1;
                    let shakeCount = 0;
                    const originalPos = targetRobot.position.clone();
                    
                    const shakeInterval = setInterval(() => {
                        targetRobot.position.x = originalPos.x + (Math.random() - 0.5) * 0.5;
                        shakeCount++;
                        if (shakeCount > 10) {
                            clearInterval(shakeInterval);
                            targetRobot.position.x = originalPos.x;
                            laserBeam.visible = false;
                        }
                    }, 50);

                } else if (roomData.lastLog.includes('صاروخ')) {
                    playSound('laser');
                    // تأثير وميض للشاشة (محاكاة الانفجار)
                    document.body.style.backgroundColor = '#ff0055';
                    setTimeout(() => document.body.style.backgroundColor = '#05050a', 200);

                    const isP1Attacker = roomData.lastLog.includes(roomData.players.p1.name);
                    const targetRobot = isP1Attacker ? robotP2 : robotP1;
                    let shakeCount = 0;
                    const originalPos = targetRobot.position.clone();
                    
                    const shakeInterval = setInterval(() => {
                        targetRobot.position.x = originalPos.x + (Math.random() - 0.5) * 1.5;
                        targetRobot.position.y = originalPos.y + (Math.random() - 0.5) * 1.5;
                        shakeCount++;
                        if (shakeCount > 20) {
                            clearInterval(shakeInterval);
                            targetRobot.position.copy(originalPos);
                        }
                    }, 30);
                } else if (roomData.lastLog.includes('أصلح')) {
                    playSound('laser');
                }
            }
        }

        // ==========================================
        // 9. الدردشة
        // ==========================================
        document.getElementById('chatToggle').addEventListener('click', () => document.getElementById('chatBox').classList.add('open'));
        document.getElementById('closeChat').addEventListener('click', () => document.getElementById('chatBox').classList.remove('open'));
        
        document.getElementById('sendChatBtn').addEventListener('click', sendMessage);
        document.getElementById('chatInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !currentRoom) return;
            
            db.ref('fights3d/' + currentRoom + '/messages').push({
                sender: myName, text: text, timestamp: Date.now()
            });
            input.value = '';
        }

        function renderChat() {
            if (!roomData.messages) return;
            const msgs = Object.values(roomData.messages).sort((a, b) => a.timestamp - b.timestamp);
            
            if (msgs.length !== lastMessageCount) {
                lastMessageCount = msgs.length;
                let html = '';
                msgs.forEach(msg => {
                    const isMe = msg.sender === myName;
                    html += `<div class="msg ${isMe ? 'me' : 'other'}">${msg.text}</div>`;
                });
                document.getElementById('chatMessages').innerHTML = html;
                document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
            }
        }

        // إعادة اللعب
        document.getElementById('closeOverlayBtn').addEventListener('click', () => {
            document.getElementById('winnerOverlay').classList.remove('show');
            if (roomData.host === myId) {
                db.ref('fights3d/' + currentRoom).update({
                    status: 'playing',
                    p1_hp: 100, p2_hp: 100,
                    turn: 'p1',
                    winner: null,
                    lastLog: "معركة جديدة بدأت! ⚔️"
                });
            }
        });

    </script>
</body>
