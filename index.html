<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ارسم وخمن | Draw & Guess</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --panel-2: #0b1120;
            --p1: #00f3ff;
            --p2: #ff0055;
            --gold: #ffcc00;
            --green: #22c55e;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg);
            color: #fff;
        }

        .app-container {
            position: relative;
            width: 100%;
            max-width: 560px;
            height: 100dvh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.85);
        }

        .dev-banner {
            background: linear-gradient(90deg, rgba(0, 243, 255, 0.12), rgba(255, 0, 85, 0.12));
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
            padding: 6px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            z-index: 10;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dev-banner span {
            color: var(--p1);
            font-size: 0.82rem;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.45);
        }
        .sound-toggle {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            border-radius: 6px;
            padding: 2px 7px;
            font-size: 0.72rem;
            cursor: pointer;
        }

        .screen {
            display: none;
            flex-direction: column;
            flex: 1;
            height: 100%;
            overflow-y: auto;
            position: relative;
        }
        .screen.active { display: flex; }

        #authScreen {
            padding: 20px;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            width: 100%;
            background: var(--panel);
            padding: 24px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }
        .title {
            font-size: 1.85rem;
            color: #fff;
            font-weight: 900;
            margin-bottom: 4px;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 18px;
        }

        .input-group {
            margin-bottom: 12px;
            text-align: right;
        }
        .input-group label {
            display: block;
            color: #cbd5e1;
            margin-bottom: 5px;
            font-weight: 700;
            font-size: 0.8rem;
        }
        .input-group input {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.35);
            color: #fff;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }
        .input-group input:focus {
            border-color: var(--p1);
        }

        .btn {
            padding: 11px 14px;
            font-size: 0.98rem;
            font-weight: 900;
            color: #000;
            background: var(--p1);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover { filter: brightness(1.06); }
        .btn:active { transform: scale(0.98); }
        .btn-outline {
            background: transparent;
            color: var(--p2);
            border: 2px solid var(--p2);
            margin-top: 8px;
        }
        .btn-sm {
            padding: 6px 10px;
            font-size: 0.78rem;
            width: auto;
            border-radius: 8px;
        }
        .btn-danger {
            background: rgba(255, 0, 85, 0.16);
            color: #ff6b9d;
            border: 1px solid rgba(255, 0, 85, 0.4);
        }

        #lobbyScreen {
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            gap: 12px;
        }
        .room-code {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--gold);
            letter-spacing: 8px;
            margin: 6px 0;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.35);
        }
        .wait-text {
            color: var(--text-muted);
            font-size: 0.95rem;
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

        #gameScreen {
            background: var(--panel-2);
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 7px;
            overflow: hidden;
            gap: 6px;
        }
        #gameScreen.active { display: flex; }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel);
            padding: 7px 10px;
            border-radius: 10px;
            flex-shrink: 0;
            gap: 6px;
        }
        .p-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 68px;
        }
        .p-name { font-size: 0.75rem; font-weight: 700; white-space: nowrap; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
        .p-score { font-size: 1.05rem; font-weight: 900; line-height: 1.1; }
        .p1-color { color: var(--p1); text-shadow: 0 0 10px rgba(0, 243, 255, 0.4); }
        .p2-color { color: var(--p2); text-shadow: 0 0 10px rgba(255, 0, 85, 0.4); }

        .center-status {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .round-info { font-size: 0.82rem; font-weight: 900; color: var(--gold); }
        .timer-badge {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 1px 8px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 900;
            color: #fff;
        }
        .timer-badge.urgent {
            color: #ff4d6d;
            border-color: #ff4d6d;
            animation: pulse 0.6s infinite alternate;
        }

        .word-banner {
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            font-size: 0.84rem;
        }
        .secret-word {
            color: var(--green);
            font-weight: 900;
            font-size: 0.95rem;
        }
        .hint-word {
            color: var(--gold);
            font-weight: 900;
            letter-spacing: 3px;
            font-size: 0.92rem;
        }

        .canvas-container {
            flex: 1.15;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.08);
            min-height: 150px;
        }
        canvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: crosshair;
            display: block;
        }

        .drawing-toolbar {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            padding: 6px 8px;
            display: none;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            z-index: 15;
        }
        .drawing-toolbar.active { display: flex; }

        .color-palette {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .color-swatch {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.35);
            cursor: pointer;
            transition: transform 0.15s;
        }
        .color-swatch.selected {
            transform: scale(1.2);
            border-color: #fff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        .size-group, .action-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .tool-btn {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            height: 28px;
            min-width: 28px;
            padding: 0 7px;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e2e8f0;
            font-size: 0.78rem;
            font-weight: 700;
        }
        .tool-btn.active {
            background: var(--p1);
            color: #000;
            border-color: var(--p1);
        }
        .tool-btn:active { transform: scale(0.95); }

        .chat-section {
            flex: 0.65;
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            min-height: 115px;
        }
        .chat-messages {
            flex: 1;
            padding: 6px 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .msg {
            padding: 4px 9px;
            border-radius: 8px;
            font-size: 0.78rem;
            max-width: 85%;
            word-break: break-word;
        }
        .msg.me {
            background: var(--p1);
            color: #000;
            font-weight: 700;
            align-self: flex-start;
        }
        .msg.other {
            background: #334155;
            color: #fff;
            align-self: flex-end;
        }
        .msg.system {
            background: rgba(255, 204, 0, 0.12);
            color: var(--gold);
            align-self: center;
            font-weight: 700;
            font-size: 0.74rem;
            text-align: center;
        }
        
        .chat-input {
            display: flex;
            gap: 6px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.35);
        }
        .chat-input input {
            flex: 1;
            border: none;
            background: transparent;
            color: #fff;
            outline: none;
            padding: 5px 10px;
            font-size: 0.85rem;
        }
        .chat-input button {
            background: var(--p1);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .word-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            text-align: center;
        }
        .word-overlay.show { display: flex; }
        .word-title { font-size: 1.2rem; margin-bottom: 16px; color: var(--gold); font-weight: 900; }
        .word-btn {
            background: #fff;
            color: #000;
            padding: 13px;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 900;
            width: 100%;
            max-width: 320px;
            margin-bottom: 10px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .word-btn:hover { background: var(--p1); transform: scale(1.02); }

        .winner-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
            padding: 20px;
            text-align: center;
            gap: 12px;
        }
        .winner-overlay.show { opacity: 1; pointer-events: auto; }
        .winner-title { font-size: 1.75rem; font-weight: 900; color: var(--gold); }
        .winner-sub { font-size: 1rem; color: #e2e8f0; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="dev-banner">
            <div>تطوير المبدع: <span>عبدالرحيم الجياشي الشمري</span></div>
            <button class="sound-toggle" id="soundToggleBtn" title="تشغيل/كتم الصوت">
                <i class="fas fa-volume-up" id="soundIcon"></i>
            </button>
        </div>

        <div class="screen active" id="authScreen">
            <div class="login-card">
                <div class="title">ارسم وخمن 🎨</div>
                <div class="subtitle">ارسم الكلمة ودع صديقك يخمنها قبل انتهاء الوقت!</div>
                
                <div class="input-group">
                    <label>اسمك:</label>
                    <input type="text" id="playerName" placeholder="اكتب اسمك..." maxlength="15">
                </div>
                
                <button class="btn" id="createRoomBtn"><i class="fas fa-plus"></i> إنشاء غرفة</button>
                
                <div style="text-align: center; margin: 10px 0; color: #64748b; font-weight: bold; font-size: 0.85rem;">- أو -</div>
                
                <div class="input-group">
                    <label>كود الغرفة (للدخول):</label>
                    <input type="text" id="roomCodeInput" placeholder="مثال: A7B2" style="text-transform: uppercase;" maxlength="6">
                </div>
                <button class="btn btn-outline" id="joinRoomBtn"><i class="fas fa-sign-in-alt"></i> دخول الغرفة</button>
            </div>
        </div>

        <div class="screen" id="lobbyScreen">
            <h2 style="color: #fff;">غرفة الانتظار</h2>
            <div class="room-code" id="displayRoomCode">----</div>
            <div style="display: flex; gap: 8px;">
                <button class="btn btn-sm" id="copyCodeBtn"><i class="fas fa-copy"></i> نسخ الكود</button>
                <button class="btn btn-sm btn-danger" id="leaveLobbyBtn"><i class="fas fa-door-open"></i> خروج</button>
            </div>
            <p class="wait-text" id="waitMsg">بانتظار انضمام صديقك...</p>
        </div>

        <div class="screen" id="gameScreen">
            
            <div class="game-header">
                <div class="p-info">
                    <span class="p-name p2-color" id="opName">الخصم</span>
                    <span class="p-score p2-color" id="opScore">0</span>
                </div>

                <div class="center-status">
                    <div class="round-info" id="roundDisplay">الجولة 1 / 5</div>
                    <div class="timer-badge" id="timerDisplay">60s</div>
                </div>

                <div class="p-info">
                    <span class="p-name p1-color" id="myName">أنت</span>
                    <span class="p-score p1-color" id="myScore">0</span>
                </div>
            </div>

            <div class="word-banner" id="wordBanner">
                <span id="wordStatusText">بانتظار اختيار الكلمة...</span>
                <button class="btn btn-sm btn-danger" id="leaveGameBtn" title="مغادرة"><i class="fas fa-times"></i></button>
            </div>

            <div class="canvas-container" id="canvasContainer">
                <canvas id="gameCanvas"></canvas>

                <div class="drawing-toolbar" id="drawingToolbar">
                    <div class="color-palette" id="colorPalette">
                        <div class="color-swatch selected" data-color="#000000" style="background:#000000;"></div>
                        <div class="color-swatch" data-color="#ef4444" style="background:#ef4444;"></div>
                        <div class="color-swatch" data-color="#2563eb" style="background:#2563eb;"></div>
                        <div class="color-swatch" data-color="#16a34a" style="background:#16a34a;"></div>
                        <div class="color-swatch" data-color="#eab308" style="background:#eab308;"></div>
                        <div class="color-swatch" data-color="#9333ea" style="background:#9333ea;"></div>
                    </div>

                    <div class="size-group">
                        <button class="tool-btn size-btn" data-size="3" title="خط رفيع">S</button>
                        <button class="tool-btn size-btn active" data-size="6" title="خط متوسط">M</button>
                        <button class="tool-btn size-btn" data-size="11" title="خط عريض">L</button>
                    </div>

                    <div class="action-group">
                        <button class="tool-btn" id="undoBtn" title="تراجع"><i class="fas fa-undo"></i></button>
                        <button class="tool-btn" id="clearBtn" title="مسح الكل"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            </div>

            <div class="chat-section">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="اكتب تخمينك هنا..." autocomplete="off">
                    <button id="sendChatBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div class="word-overlay" id="wordOverlay">
                <div class="word-title">اختر كلمة لترسمها:</div>
                <div id="wordOptionsContainer" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
            </div>

            <div class="winner-overlay" id="winnerOverlay">
                <div class="winner-title" id="winnerTitle">انتهت الجولة!</div>
                <div class="winner-sub" id="winnerSub"></div>
                <button class="btn" id="nextRoundBtn" style="max-width: 220px;">الجولة التالية</button>
            </div>

        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBQa9TnbuCCPqfnXY-T9t-uwag0J2WEnFI",
            authDomain: "arrahimm.firebaseapp.com",
            databaseURL: "https://arrahimm-default-rtdb.firebaseio.com/",
            projectId: "arrahimm",
            storageBucket: "arrahimm.firebasestorage.app",
            messagingSenderId: "150237867312",
            appId: "1:150237867312:web:364d67877f9ff4d2bbacf5"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const wordsBank = [
            ["تفاحة", "سيارة", "شمس", "بيت", "قطة", "طائرة", "موزة", "سمكة"],
            ["رجل يطير", "قطة تسبح", "بيتزا تطاردك", "وحش فضائي", "دماغ يفكر", "بطيخ يبكي"],
            ["سيجما", "مجسم مواي", "ضفدع حزين", "ميمر يضحك", "شخصية كرتونية", "نظارة شمسية"],
            ["حصان بجناحين", "برجر يمشي", "هاتف يغضب", "روبوت يحب", "ساحر يطبخ", "سفينة فضاء"]
        ];

        let myId = 'player_' + Math.floor(Math.random() * 100000);
        let myName = "";
        let currentRoom = "";
        let roomData = {};
        let myRole = "";
        let isDrawer = false;

        const TOTAL_ROUNDS = 5;
        const ROUND_SECONDS = 60;
        let timerInterval = null;
        let remainingSeconds = ROUND_SECONDS;
        let soundEnabled = true;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentStroke = null;
        let brushColor = "#000000";
        let brushSize = 6;
        let lastSentTime = 0;

        const authScreen = document.getElementById('authScreen');
        const lobbyScreen = document.getElementById('lobbyScreen');
        const gameScreen = document.getElementById('gameScreen');
        const winnerOverlay = document.getElementById('winnerOverlay');
        const wordOverlay = document.getElementById('wordOverlay');
        const chatMessages = document.getElementById('chatMessages');
        const drawingToolbar = document.getElementById('drawingToolbar');
        const timerDisplay = document.getElementById('timerDisplay');
        const wordStatusText = document.getElementById('wordStatusText');

        let lastMessageCount = 0;

        function playTone(freq = 520, duration = 0.14, type = 'sine') {
            if (!soundEnabled) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        document.getElementById('soundToggleBtn').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            document.getElementById('soundIcon').className = soundEnabled ? 'fas fa-volume-up' : 'fas fa-volume-mute';
        });

        document.getElementById('createRoomBtn').addEventListener('click', () => {
            myName = document.getElementById('playerName').value.trim();
            if (!myName) return alert("الرجاء كتابة اسمك أولاً");

            const code = Math.random().toString(36).substring(2, 6).toUpperCase();
            currentRoom = code;
            myRole = 'p1';

            const roomRef = db.ref('rooms/' + code);
            roomRef.set({
                host: myId,
                status: 'waiting',
                round: 1,
                turn: 'p1',
                roundStartTime: null,
                players: {
                    p1: { name: myName, score: 0 },
                    p2: null
                },
                word: null,
                strokes: null,
                liveStroke: null,
                winner: null
            }).then(() => {
                roomRef.onDisconnect().remove();
                enterLobby();
            });
        });

        document.getElementById('joinRoomBtn').addEventListener('click', () => {
            myName = document.getElementById('playerName').value.trim();
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if (!myName) return alert("الرجاء كتابة اسمك أولاً");
            if (!code) return alert("الرجاء كتابة كود الغرفة");

            currentRoom = code;
            myRole = 'p2';

            const roomRef = db.ref('rooms/' + code);
            roomRef.once('value').then((snapshot) => {
                if (!snapshot.exists()) {
                    return alert("الغرفة غير موجودة.");
                }
                const data = snapshot.val();
                const updates = {};
                updates['players/p2'] = { name: myName, score: 0 };
                if (data.status === 'waiting') {
                    updates['status'] = 'playing';
                }
                roomRef.update(updates).then(() => {
                    roomRef.child('players/p2').onDisconnect().remove();
                    enterLobby();
                });
            });
        });

        document.getElementById('copyCodeBtn').addEventListener('click', () => {
            navigator.clipboard?.writeText(currentRoom);
            alert("تم نسخ كود الغرفة: " + currentRoom);
        });

        function leaveRoom() {
            if (currentRoom) {
                const roomRef = db.ref('rooms/' + currentRoom);
                roomRef.off();
                roomRef.onDisconnect().cancel();
                if (myRole === 'p2') {
                    roomRef.child('players/p2').remove();
                } else if (myRole === 'p1') {
                    roomRef.remove();
                }
            }
            clearInterval(timerInterval);
            currentRoom = "";
            myRole = "";
            roomData = {};
            lastMessageCount = 0;
            chatMessages.innerHTML = '';
            clearCanvas();
            gameScreen.classList.remove('active');
            lobbyScreen.classList.remove('active');
            authScreen.classList.add('active');
        }

        document.getElementById('leaveLobbyBtn').addEventListener('click', leaveRoom);
        document.getElementById('leaveGameBtn').addEventListener('click', leaveRoom);

        function enterLobby() {
            authScreen.classList.remove('active');
            lobbyScreen.classList.add('active');
            document.getElementById('displayRoomCode').textContent = currentRoom;
            listenToRoom();
        }

        function listenToRoom() {
            const roomRef = db.ref('rooms/' + currentRoom);
            roomRef.off();
            roomRef.on('value', (snapshot) => {
                if (!snapshot.exists()) {
                    alert("تم إغلاق الغرفة.");
                    leaveRoom();
                    return;
                }
                roomData = snapshot.val() || {};

                if (myRole === 'p1' && roomData.status === 'waiting' && roomData.players && roomData.players.p2) {
                    roomRef.update({ status: 'playing' });
                }

                if (roomData.status === 'playing' || (roomData.players && roomData.players.p1 && roomData.players.p2)) {
                    if (!gameScreen.classList.contains('active')) {
                        lobbyScreen.classList.remove('active');
                        gameScreen.classList.add('active');
                        requestAnimationFrame(() => {
                            resizeCanvas();
                            renderCanvasFromFirebase();
                        });
                        playTone(660, 0.15);
                    }
                    updateGameState();
                    renderChat();
                    renderCanvasFromFirebase();
                }
            });
        }

        function updateGameState() {
            const p1 = roomData.players?.p1 || { name: 'اللاعب 1', score: 0 };
            const p2 = roomData.players?.p2 || { name: 'الخصم', score: 0 };
            const opRole = myRole === 'p1' ? 'p2' : 'p1';
            const meObj = myRole === 'p1' ? p1 : p2;
            const opObj = opRole === 'p1' ? p1 : p2;

            document.getElementById('myName').textContent = meObj.name;
            document.getElementById('myScore').textContent = meObj.score;
            document.getElementById('opName').textContent = opObj.name;
            document.getElementById('opScore').textContent = opObj.score;
            document.getElementById('roundDisplay').textContent = `الجولة ${roomData.round || 1} / ${TOTAL_ROUNDS}`;

            isDrawer = (roomData.turn === myRole);

            if (isDrawer) {
                drawingToolbar.classList.add('active');
                if (!roomData.word && !roomData.winner && !wordOverlay.classList.contains('show')) {
                    showWordOptions();
                }
            } else {
                drawingToolbar.classList.remove('active');
                wordOverlay.classList.remove('show');
            }

            syncTimer();
            updateWordBanner();

            if (roomData.winner) {
                wordOverlay.classList.remove('show');
                if (!winnerOverlay.classList.contains('show')) {
                    showRoundWinner();
                }
            } else {
                winnerOverlay.classList.remove('show');
            }
        }

        function syncTimer() {
            clearInterval(timerInterval);

            if (!roomData.word || roomData.winner || !roomData.roundStartTime) {
                timerDisplay.textContent = `${ROUND_SECONDS}s`;
                timerDisplay.classList.remove('urgent');
                return;
            }

            const tick = () => {
                const elapsed = Math.floor((Date.now() - roomData.roundStartTime) / 1000);
                remainingSeconds = Math.max(0, ROUND_SECONDS - elapsed);
                timerDisplay.textContent = `${remainingSeconds}s`;

                if (remainingSeconds <= 10) {
                    timerDisplay.classList.add('urgent');
                } else {
                    timerDisplay.classList.remove('urgent');
                }

                updateWordBanner();

                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    if (myRole === 'p1' && !roomData.winner) {
                        db.ref(`rooms/${currentRoom}`).update({
                            winner: 'draw',
                            liveStroke: null
                        });
                    }
                }
            };

            tick();
            timerInterval = setInterval(tick, 500);
        }

        function updateWordBanner() {
            if (!roomData.word) {
                wordStatusText.innerHTML = isDrawer
                    ? 'اختر كلمة لتبدأ الرسم...'
                    : 'بانتظار اختيار الرسام للكلمة...';
                return;
            }

            if (isDrawer) {
                wordStatusText.innerHTML = `كلمتك: <span class="secret-word">${escapeHtml(roomData.word)}</span>`;
            } else {
                const cleanWord = roomData.word;
                const chars = [...cleanWord];
                const revealCount = remainingSeconds <= 20 ? Math.max(1, Math.floor(chars.length / 2)) : 0;

                const hint = chars.map((ch, idx) => {
                    if (ch === ' ') return '  ';
                    if (idx < revealCount) return escapeHtml(ch);
                    return 'ـ';
                }).join(' ');

                wordStatusText.innerHTML = `تلميح (${chars.length} أحرف): <span class="hint-word">${hint}</span>`;
            }
        }

        function showWordOptions() {
            const levelIndex = Math.floor(((roomData.round || 1) - 1) / 2);
            const words = wordsBank[Math.min(levelIndex, wordsBank.length - 1)];
            const shuffled = [...words].sort(() => 0.5 - Math.random()).slice(0, 3);

            const container = document.getElementById('wordOptionsContainer');
            container.innerHTML = '';

            shuffled.forEach(word => {
                const btn = document.createElement('button');
                btn.className = 'word-btn';
                btn.textContent = word;
                btn.onclick = () => {
                    wordOverlay.classList.remove('show');
                    clearCanvas();
                    db.ref(`rooms/${currentRoom}`).update({
                        word: word,
                        strokes: null,
                        liveStroke: null,
                        winner: null,
                        roundStartTime: Date.now()
                    });
                    playTone(740, 0.12);
                };
                container.appendChild(btn);
            });

            wordOverlay.classList.add('show');
        }

        function showRoundWinner() {
            winnerOverlay.classList.add('show');
            const title = document.getElementById('winnerTitle');
            const sub = document.getElementById('winnerSub');

            if (roomData.winner === 'draw') {
                title.textContent = "انتهى الوقت! ⏳";
                sub.textContent = `الكلمة كانت: ${roomData.word || ''}`;
                playTone(280, 0.25, 'triangle');
            } else {
                title.textContent = "تخمين صحيح! 🎉";
                sub.textContent = `الكلمة كانت: ${roomData.word || ''}`;
                playTone(880, 0.2);
            }

            const nextBtn = document.getElementById('nextRoundBtn');
            nextBtn.style.display = (myRole === 'p1') ? 'block' : 'none';
            nextBtn.textContent = (roomData.round || 1) >= TOTAL_ROUNDS ? 'عرض النتيجة النهائية' : 'الجولة التالية';
        }

        document.getElementById('nextRoundBtn').addEventListener('click', () => {
            if (myRole !== 'p1') return;

            if ((roomData.round || 1) >= TOTAL_ROUNDS) {
                const p1 = roomData.players.p1;
                const p2 = roomData.players.p2 || { name: 'الخصم', score: 0 };
                const msg = p1.score === p2.score
                    ? `تعادل! (${p1.score} - ${p2.score})`
                    : `الفائز هو: ${p1.score > p2.score ? p1.name : p2.name} (${p1.score} - ${p2.score})`;

                alert("انتهت اللعبة! " + msg);
                db.ref('rooms/' + currentRoom).remove();
                return;
            }

            const nextTurn = roomData.turn === 'p1' ? 'p2' : 'p1';
            clearCanvas();
            db.ref('rooms/' + currentRoom).update({
                round: (roomData.round || 1) + 1,
                turn: nextTurn,
                word: null,
                winner: null,
                roundStartTime: null,
                strokes: null,
                liveStroke: null
            });
        });

        document.getElementById('sendChatBtn').addEventListener('click', sendMessage);
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !currentRoom) return;

            if (!isDrawer && roomData.word && !roomData.winner) {
                if (text.toLowerCase().trim() === roomData.word.toLowerCase().trim()) {
                    input.value = '';

                    const guesserRole = myRole;
                    const drawerRole = myRole === 'p1' ? 'p2' : 'p1';

                    const gScore = (roomData.players?.[guesserRole]?.score || 0) + 10;
                    const dScore = (roomData.players?.[drawerRole]?.score || 0) + 5;

                    const updates = {};
                    updates[`rooms/${currentRoom}/players/${guesserRole}/score`] = gScore;
                    updates[`rooms/${currentRoom}/players/${drawerRole}/score`] = dScore;
                    updates[`rooms/${currentRoom}/winner`] = 'guessed';
                    updates[`rooms/${currentRoom}/liveStroke`] = null;

                    db.ref().update(updates);

                    db.ref('rooms/' + currentRoom + '/messages').push({
                        sender: "النظام",
                        text: `${myName} خمن الكلمة بشكل صحيح! (+10 نقاط) 🎉`,
                        isSystem: true,
                        timestamp: Date.now()
                    });
                    return;
                }
            }

            db.ref('rooms/' + currentRoom + '/messages').push({
                sender: myName,
                text: text,
                isSystem: false,
                timestamp: Date.now()
            });
            input.value = '';
        }

        function renderChat() {
            if (!roomData.messages) return;
            const msgs = Object.values(roomData.messages).sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

            if (msgs.length !== lastMessageCount) {
                lastMessageCount = msgs.length;
                let html = '';
                msgs.forEach(msg => {
                    if (msg.isSystem) {
                        html += `<div class="msg system">${escapeHtml(msg.text)}</div>`;
                    } else {
                        const isMe = msg.sender === myName;
                        html += `<div class="msg ${isMe ? 'me' : 'other'}"><strong>${escapeHtml(msg.sender)}:</strong> ${escapeHtml(msg.text)}</div>`;
                    }
                });
                chatMessages.innerHTML = html;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        document.querySelectorAll('.color-swatch').forEach(swatch => {
            swatch.addEventListener('click', () => {
                document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
                swatch.classList.add('selected');
                brushColor = swatch.dataset.color;
            });
        });

        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                brushSize = Number(btn.dataset.size) || 6;
            });
        });

        function applyBrushStyle(color = brushColor, size = brushSize) {
            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = color;
        }

        function resizeCanvas() {
            const parent = canvas.parentElement;
            if (!parent || parent.clientWidth === 0 || parent.clientHeight === 0) return;
            const newW = parent.clientWidth;
            const newH = parent.clientHeight;
            if (canvas.width !== newW || canvas.height !== newH) {
                canvas.width = newW;
                canvas.height = newH;
                redrawLocalCanvas();
            }
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            renderCanvasFromFirebase();
        });

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
            const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            return {
                x: Math.max(0, Math.min(1, x / (rect.width || 1))),
                y: Math.max(0, Math.min(1, y / (rect.height || 1)))
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!isDrawer || !roomData.word || roomData.winner) return;
            e.preventDefault();
            resizeCanvas();
            try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
            isDrawing = true;
            const pos = getCoordinates(e);
            currentStroke = {
                color: brushColor,
                size: brushSize,
                points: [pos]
            };
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || !isDrawer || !currentStroke) return;
            e.preventDefault();
            const pos = getCoordinates(e);
            const pts = currentStroke.points;
            const prevPos = pts[pts.length - 1];
            pts.push(pos);

            drawSegment(prevPos, pos, currentStroke.color, currentStroke.size);

            const now = Date.now();
            if (now - lastSentTime > 45 && pts.length >= 2 && currentRoom) {
                lastSentTime = now;
                db.ref(`rooms/${currentRoom}/liveStroke`).set(currentStroke).catch(() => {});
            }
        });

        function finishStroke(e) {
            if (!isDrawing || !isDrawer) return;
            isDrawing = false;
            if (e && e.pointerId !== undefined) {
                try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
            }

            if (currentStroke && currentStroke.points.length > 1 && currentRoom) {
                db.ref(`rooms/${currentRoom}/strokes`).push(currentStroke);
            }
            currentStroke = null;
            if (currentRoom) {
                db.ref(`rooms/${currentRoom}/liveStroke`).remove();
            }
        }

        canvas.addEventListener('pointerup', finishStroke);
        canvas.addEventListener('pointercancel', finishStroke);

        function drawSegment(from, to, color, size) {
            if (!from || !to || canvas.width === 0 || canvas.height === 0) return;
            applyBrushStyle(color, size);
            ctx.beginPath();
            ctx.moveTo(from.x * canvas.width, from.y * canvas.height);
            ctx.lineTo(to.x * canvas.width, to.y * canvas.height);
            ctx.stroke();
        }

        function drawStrokeObject(strokeObj) {
            if (!strokeObj || canvas.width === 0 || canvas.height === 0) return;
            const pts = Array.isArray(strokeObj.points)
                ? strokeObj.points
                : Object.values(strokeObj.points || {});
            if (pts.length < 2) return;

            applyBrushStyle(strokeObj.color || '#000000', strokeObj.size || 6);
            ctx.beginPath();
            ctx.moveTo(pts[0].x * canvas.width, pts[0].y * canvas.height);
            for (let i = 1; i < pts.length; i++) {
                ctx.lineTo(pts[i].x * canvas.width, pts[i].y * canvas.height);
            }
            ctx.stroke();
        }

        function renderCanvasFromFirebase() {
            if (isDrawer) return;

            resizeCanvas();
            if (canvas.width === 0 || canvas.height === 0) {
                setTimeout(() => {
                    resizeCanvas();
                    redrawLocalCanvas();
                }, 80);
                return;
            }

            const strokesList = roomData.strokes ? Object.values(roomData.strokes) : [];
            const liveStroke = roomData.liveStroke || null;
            redrawLocalCanvas(strokesList, liveStroke);
        }

        function redrawLocalCanvas(strokesList = null, liveStroke = null) {
            if (canvas.width === 0 || canvas.height === 0) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const list = strokesList || (roomData.strokes ? Object.values(roomData.strokes) : []);
            list.forEach(stroke => drawStrokeObject(stroke));

            const activeLive = liveStroke !== null ? liveStroke : (roomData.liveStroke || null);
            if (activeLive) {
                drawStrokeObject(activeLive);
            }
        }

        document.getElementById('undoBtn').addEventListener('click', () => {
            if (!isDrawer || !roomData.strokes || !currentRoom) return;
            const entries = Object.entries(roomData.strokes);
            if (entries.length === 0) return;
            const lastKey = entries[entries.length - 1][0];
            db.ref(`rooms/${currentRoom}/strokes/${lastKey}`).remove().then(() => {
                redrawLocalCanvas();
            });
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            if (!isDrawer || !currentRoom) return;
            db.ref(`rooms/${currentRoom}/strokes`).remove();
            db.ref(`rooms/${currentRoom}/liveStroke`).remove();
            clearCanvas();
        });

        function clearCanvas() {
            if (canvas.width > 0 && canvas.height > 0) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }
    </script>
</body>
</html>
