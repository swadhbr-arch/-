<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تحدي إكس أو | Ultimate XO</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg: #0f172a; --panel: #1e293b; 
            --my-color: #00f3ff; --op-color: #ff0055; --gold: #ffcc00;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100%; width: 100%; overflow: hidden; background-color: var(--bg); color: #fff;
            background-image: radial-gradient(circle at center, rgba(0,243,255,0.05) 0%, transparent 70%);
        }

        .app-container {
            position: relative; width: 100%; max-width: 500px; height: 100dvh; 
            margin: 0 auto; display: flex; flex-direction: column;
            background: var(--bg); box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* شريط حقوق المطور */
        .dev-banner {
            background: linear-gradient(90deg, rgba(0,243,255,0.1), rgba(255,0,85,0.1));
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-align: center; padding: 6px; font-size: 0.75rem; font-weight: 700;
            z-index: 10; flex-shrink: 0;
        }
        .dev-banner span { color: var(--my-color); font-size: 0.85rem; text-shadow: 0 0 10px rgba(0,243,255,0.5);}

        /* ===== الشاشات ===== */
        .screen { display: none; flex-direction: column; flex: 1; height: 100%; overflow-y: auto; }
        .screen.active { display: flex; }

        /* ===== 1. شاشة الدخول ===== */
        #authScreen { padding: 20px; justify-content: center; align-items: center; }
        .login-card {
            width: 100%; background: var(--panel); padding: 25px 20px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08); text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .title { font-size: 2rem; color: #fff; font-weight: 900; margin-bottom: 5px; }
        .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }

        .input-group { margin-bottom: 12px; text-align: right; }
        .input-group label { display: block; color: #ccc; margin-bottom: 5px; font-weight: 700; font-size: 0.8rem;}
        .input-group input {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3); color: #fff; font-size: 1rem; outline: none; text-align: center;
        }

        .btn {
            padding: 12px; font-size: 1rem; font-weight: 900; color: #000; background: var(--my-color);
            border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:hover { background: #fff; box-shadow: 0 0 15px var(--my-color); }
        .btn-outline { background: transparent; color: var(--op-color); border: 2px solid var(--op-color); margin-top: 10px;}

        /* ===== 2. شاشة الانتظار ===== */
        #lobbyScreen { justify-content: center; align-items: center; text-align: center; padding: 20px;}
        .room-code { font-size: 3rem; font-weight: 900; color: var(--gold); letter-spacing: 8px; margin: 15px 0; text-shadow: 0 0 20px rgba(255,204,0,0.4);}
        .wait-text { color: var(--text-muted); font-size: 0.95rem; animation: pulse 1.5s infinite alternate;}
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

        /* ===== 3. شاشة اللعب ===== */
        #gameScreen { background: #000; display: none; flex-direction: column; height: 100%; padding: 10px; overflow: hidden;}
        #gameScreen.active { display: flex; }

        /* --- قسم اللعبة (العلوي) --- */
        .game-section {
            flex: 1; display: flex; flex-direction: column; background: var(--panel);
            border-radius: 15px; padding: 10px; margin-bottom: 10px; position: relative;
        }

        /* الهيدر (الأسماء والدور) */
        .game-header {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 10px; margin-bottom: 15px;
        }
        .p-info { display: flex; flex-direction: column; align-items: center; }
        .p-name { font-size: 0.8rem; font-weight: 700; color: #ccc; }
        .p-symbol { font-size: 1.2rem; font-weight: 900; }
        .p1-color { color: var(--my-color); text-shadow: 0 0 10px var(--my-color); }
        .p2-color { color: var(--op-color); text-shadow: 0 0 10px var(--op-color); }
        
        .turn-indicator { font-size: 0.85rem; font-weight: 900; color: var(--gold); background: rgba(255,204,0,0.1); padding: 4px 10px; border-radius: 15px;}

        /* لوحة إكس أو */
        .board-container {
            flex: 1; display: flex; justify-content: center; align-items: center; width: 100%;
        }
        .board {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            width: 100%; max-width: 320px; aspect-ratio: 1 / 1; /* يضمن بقاء اللوحة مربعة */
            background: rgba(0,0,0,0.4); padding: 8px; border-radius: 15px;
        }
        .cell {
            background: #0f172a; border-radius: 10px; display: flex; justify-content: center; align-items: center;
            font-size: clamp(2rem, 10vw, 3rem); font-weight: 900; cursor: pointer; transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .cell:hover { background: #1e2536; }
        .cell.x { color: var(--my-color); text-shadow: 0 0 10px var(--my-color); }
        .cell.o { color: var(--op-color); text-shadow: 0 0 10px var(--op-color); }
        .cell.win { background: rgba(0,255,102,0.2); border: 2px solid var(--success); animation: pulseWin 0.5s infinite alternate; }
        @keyframes pulseWin { from { transform: scale(1); } to { transform: scale(1.05); } }

        /* أزرار التحكم */
        .controls { display: flex; gap: 10px; margin-top: 15px; }
        .controls .btn { padding: 10px; font-size: 0.85rem; border-radius: 10px;}

        /* --- قسم الدردشة (السفلي) --- */
        .chat-section {
            flex: 0.6; display: flex; flex-direction: column;
            background: var(--panel); border-radius: 15px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05); min-height: 0; /* يمنع تمدد الشاشة */
        }
        .chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .msg { padding: 6px 12px; border-radius: 10px; font-size: 0.8rem; max-width: 85%; word-break: break-word; }
        .msg.me { background: var(--my-color); color: #000; align-self: flex-end; border-bottom-right-radius: 2px;}
        .msg.other { background: #334155; color: #fff; align-self: flex-start; border-bottom-left-radius: 2px;}
        
        .chat-input { display: flex; gap: 5px; padding: 8px; background: rgba(0,0,0,0.3); flex-shrink: 0;}
        .chat-input input { flex: 1; border: none; background: transparent; color: #fff; outline: none; padding: 5px 10px; font-size: 0.9rem; min-width: 0;}
        .chat-input button { background: var(--my-color); border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; color: #000; flex-shrink: 0;}

        /* شاشة الفائز */
        .winner-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .winner-overlay.show { opacity: 1; pointer-events: auto; }
        .winner-title { font-size: 2.5rem; font-weight: 900; margin-bottom: 20px; }
        .win-color { color: var(--my-color); text-shadow: 0 0 20px var(--my-color); }
        .lose-color { color: var(--op-color); text-shadow: 0 0 20px var(--op-color); }
        .draw-color { color: var(--gold); text-shadow: 0 0 20px var(--gold); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="dev-banner">
            تطوير المبدع: <span>عبدالرحيم الجياشي الشمري</span>
        </div>

        <!-- 1. شاشة الدخول -->
        <div class="screen active" id="authScreen">
            <div class="login-card">
                <div class="title">تحدي إكس أو ❌⭕</div>
                <div class="subtitle">لعبة الذكاء الكلاسيكية.. من سيفوز؟</div>
                
                <div class="input-group">
                    <label>اسمك:</label>
                    <input type="text" id="playerName" placeholder="اكتب اسمك..." maxlength="15">
                </div>
                
                <button class="btn" id="createRoomBtn"><i class="fas fa-plus"></i> إنشاء غرفة</button>
                
                <div style="text-align: center; margin: 10px 0; color: #555; font-weight:bold;">- أو -</div>
                
                <div class="input-group">
                    <label>كود الغرفة (للدخول):</label>
                    <input type="text" id="roomCodeInput" placeholder="مثال: A7B2" style="text-transform: uppercase;" maxlength="6">
                </div>
                <button class="btn btn-outline" id="joinRoomBtn"><i class="fas fa-sign-in-alt"></i> دخول الغرفة</button>
            </div>
        </div>

        <!-- 2. شاشة الانتظار -->
        <div class="screen" id="lobbyScreen">
            <h2 style="color: #fff; margin-bottom: 10px;">غرفة الانتظار</h2>
            <div class="room-code" id="displayRoomCode">----</div>
            <p class="wait-text" id="waitMsg">بانتظار انضمام صديقك...</p>
        </div>

        <!-- 3. شاشة اللعب -->
        <div class="screen" id="gameScreen">
            
            <!-- قسم اللعبة -->
            <div class="game-section">
                <div class="game-header">
                    <div class="p-info">
                        <span class="p-name" id="opName">الخصم</span>
                        <span class="p-symbol p2-color" id="opSymbol">O</span>
                    </div>
                    <div class="turn-indicator" id="turnDisplay">جاري التحميل...</div>
                    <div class="p-info">
                        <span class="p-name" id="myName">أنت</span>
                        <span class="p-symbol p1-color" id="mySymbol">X</span>
                    </div>
                </div>

                <div class="board-container">
                    <div class="board" id="board">
                        <div class="cell" data-index="0"></div>
                        <div class="cell" data-index="1"></div>
                        <div class="cell" data-index="2"></div>
                        <div class="cell" data-index="3"></div>
                        <div class="cell" data-index="4"></div>
                        <div class="cell" data-index="5"></div>
                        <div class="cell" data-index="6"></div>
                        <div class="cell" data-index="7"></div>
                        <div class="cell" data-index="8"></div>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn" id="nextRoundBtn" style="display: none; background: var(--gold);"><i class="fas fa-redo"></i> جولة جديدة</button>
                    <button class="btn" id="restartBtn" style="background: transparent; border: 1px solid #555; color: #aaa;"><i class="fas fa-door-open"></i> خروج</button>
                </div>
            </div>

            <!-- قسم الدردشة -->
            <div class="chat-section">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="اكتب رسالة..." autocomplete="off">
                    <button id="sendChatBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <!-- شاشة الفائز -->
            <div class="winner-overlay" id="winnerOverlay">
                <div class="winner-title" id="winnerTitle">لقد فزت! 🏆</div>
                <button class="btn" id="closeOverlayBtn" style="width: 200px;">استمرار</button>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // 1. إعدادات Firebase
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBQa9TnbuCCPqfnXY-T9t-uwag0J2WEnFI",
            authDomain: "arrahimm.firebaseapp.com",
            databaseURL: "https://arrahimm-default-rtdb.firebaseio.com/",
            projectId: "arrahimm",
            storageBucket: "arrahimm.firebasestorage.app",
            messagingSenderId: "150237867312",
            appId: "1:150237867312:web:364d67877f9ff4d2bbacf5"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        // ==========================================
        // 2. المتغيرات
        // ==========================================
        let myId = 'player_' + Math.floor(Math.random() * 10000);
        let myName = "";
        let currentRoom = "";
        let roomData = {};
        let myRole = ""; // 'p1' (X) أو 'p2' (O)
        let lastMessageCount = 0;

        // العناصر
        const authScreen = document.getElementById('authScreen');
        const lobbyScreen = document.getElementById('lobbyScreen');
        const gameScreen = document.getElementById('gameScreen');
        const winnerOverlay = document.getElementById('winnerOverlay');
        const chatMessages = document.getElementById('chatMessages');

        // ==========================================
        // 3. إنشاء ودخول الغرف
        // ==========================================
        document.getElementById('createRoomBtn').addEventListener('click', () => {
            myName = document.getElementById('playerName').value.trim();
            if (!myName) return alert("الرجاء كتابة اسمك أولاً");
            
            const code = Math.random().toString(36).substring(2, 6).toUpperCase();
            currentRoom = code;
            myRole = 'p1';
            
            db.ref('ultimate_xo/' + code).set({
                host: myId,
                status: 'waiting',
                players: { p1: { name: myName }, p2: null },
                board: ["", "", "", "", "", "", "", "", ""],
                turn: 'p1',
                winner: null
            }).then(() => enterLobby());
        });

        document.getElementById('joinRoomBtn').addEventListener('click', () => {
            myName = document.getElementById('playerName').value.trim();
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if (!myName) return alert("الرجاء كتابة اسمك أولاً");
            if (!code) return alert("الرجاء كتابة كود الغرفة");

            currentRoom = code;
            myRole = 'p2';
            
            db.ref('ultimate_xo/' + code).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    db.ref(`ultimate_xo/${code}/players/p2`).set({ name: myName });
                    enterLobby();
                } else {
                    alert("الغرفة غير موجودة.");
                }
            });
        });

        function enterLobby() {
            authScreen.classList.remove('active');
            lobbyScreen.classList.add('active');
            document.getElementById('displayRoomCode').textContent = currentRoom;
            listenToRoom();
        }

        // ==========================================
        // 4. الاستماع للغرفة
        // ==========================================
        function listenToRoom() {
            db.ref('ultimate_xo/' + currentRoom).on('value', (snapshot) => {
                roomData = snapshot.val();
                if (!roomData) return;

                if (roomData.status === 'waiting' && roomData.players.p2) {
                    db.ref(`ultimate_xo/${currentRoom}`).update({ status: 'playing' });
                }

                if (roomData.status === 'playing' || roomData.status === 'finished') {
                    if (!gameScreen.classList.contains('active')) {
                        lobbyScreen.classList.remove('active');
                        gameScreen.classList.add('active');
                    }
                    updateUI();
                    renderChat();
                }
            });
        }

        // ==========================================
        // 5. تحديث واجهة اللعب
        // ==========================================
        function updateUI() {
            const me = roomData.players[myRole];
            const opRole = myRole === 'p1' ? 'p2' : 'p1';
            const op = roomData.players[opRole];

            if (!me || !op) return;

            document.getElementById('myName').textContent = me.name;
            document.getElementById('opName').textContent = op.name;
            
            const mySymbol = myRole === 'p1' ? 'X' : 'O';
            const opSymbol = myRole === 'p1' ? 'O' : 'X';
            
            document.getElementById('mySymbol').textContent = mySymbol;
            document.getElementById('opSymbol').textContent = opSymbol;

            document.getElementById('mySymbol').className = `p-symbol ${mySymbol === 'X' ? 'p1-color' : 'p2-color'}`;
            document.getElementById('opSymbol').className = `p-symbol ${opSymbol === 'X' ? 'p1-color' : 'p2-color'}`;

            // تحديث اللوحة
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, index) => {
                const val = roomData.board[index];
                cell.textContent = val;
                cell.className = 'cell'; // تصفير
                if (val === 'X') cell.classList.add('x');
                if (val === 'O') cell.classList.add('o');
            });

            // مؤشر الدور
            const turnDisplay = document.getElementById('turnDisplay');
            if (roomData.winner) {
                turnDisplay.textContent = "انتهت اللعبة";
            } else {
                if (roomData.turn === myRole) {
                    turnDisplay.textContent = "دورك الآن!";
                    turnDisplay.style.color = "var(--gold)";
                } else {
                    turnDisplay.textContent = "دور الخصم...";
                    turnDisplay.style.color = "var(--text-muted)";
                }
            }

            // التحقق من الفائز
            if (roomData.winner && !winnerOverlay.classList.contains('show')) {
                showResults();
                highlightWinningLine();
            }
        }

        // ==========================================
        // 6. منطق إسقاط القطع
        // ==========================================
        document.querySelectorAll('.cell').forEach(cell => {
            cell.addEventListener('click', () => {
                const index = cell.getAttribute('data-index');
                if (roomData.winner || roomData.turn !== myRole || roomData.board[index] !== "") return;

                const mySymbol = myRole === 'p1' ? 'X' : 'O';
                const updates = {};
                updates[`ultimate_xo/${currentRoom}/board/${index}`] = mySymbol;
                updates[`ultimate_xo/${currentRoom}/turn`] = myRole === 'p1' ? 'p2' : 'p1';
                
                db.ref().update(updates);
            });
        });

        // ==========================================
        // 7. التحقق من الفوز
        // ==========================================
        function checkGameState() {
            const b = roomData.board;
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];

            let winnerSymbol = null;
            let winPattern = null;

            for (let pattern of winPatterns) {
                const [a, b1, c] = pattern;
                if (b[a] && b[a] === b[b1] && b[a] === b[c]) {
                    winnerSymbol = b[a];
                    winPattern = pattern;
                    break;
                }
            }

            if (winnerSymbol && !roomData.winner) {
                db.ref(`ultimate_xo/${currentRoom}/winner`).set(winnerSymbol);
            }

            if (!winnerSymbol && !roomData.board.includes("") && !roomData.winner) {
                db.ref(`ultimate_xo/${currentRoom}/winner`).set("draw");
            }
        }

        // مراقبة اللوحة للتحقق من الفوز (للمضيف لتخفيف الضغط)
        setInterval(() => {
            if (roomData && roomData.status === 'playing' && !roomData.winner) {
                checkGameState();
            }
        }, 1000);

        // ==========================================
        // 8. النهاية والنتائج
        // ==========================================
        function showResults() {
            winnerOverlay.classList.add('show');
            const title = document.getElementById('winnerTitle');
            
            const mySymbol = myRole === 'p1' ? 'X' : 'O';
            const isWinner = (roomData.winner === mySymbol);
            const isDraw = (roomData.winner === "draw");

            if (isDraw) {
                title.textContent = "تعادل! 🤝";
                title.className = "winner-title draw-color";
            } else if (isWinner) {
                title.textContent = "لقد فزت! 🏆";
                title.className = "winner-title win-color";
                if(navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
            } else {
                title.textContent = "لقد خسرت! 💀";
                title.className = "winner-title lose-color";
            }

            document.getElementById('nextRoundBtn').style.display = 'flex';
        }

        function highlightWinningLine() {
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            const b = roomData.board;
            let winPattern = null;

            for (let pattern of winPatterns) {
                const [a, b1, c] = pattern;
                if (b[a] && b[a] === b[b1] && b[a] === b[c]) {
                    winPattern = pattern;
                    break;
                }
            }

            if (winPattern) {
                winPattern.forEach(idx => {
                    document.querySelectorAll('.cell')[idx].classList.add('win');
                });
            }
        }

        document.getElementById('nextRoundBtn').addEventListener('click', () => {
            winnerOverlay.classList.remove('show');
            document.getElementById('nextRoundBtn').style.display = 'none';
            
            if (roomData.host === myId) {
                db.ref('ultimate_xo/' + currentRoom).update({
                    board: ["", "", "", "", "", "", "", "", ""],
                    turn: 'p1',
                    winner: null
                });
            }
        });

        document.getElementById('closeOverlayBtn').addEventListener('click', () => {
            winnerOverlay.classList.remove('show');
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            if(confirm("هل تريد الخروج من الغرفة؟")) {
                window.location.reload();
            }
        });

        // ==========================================
        // 9. الدردشة
        // ==========================================
        document.getElementById('sendChatBtn').addEventListener('click', sendMessage);
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !currentRoom) return;
            
            db.ref('ultimate_xo/' + currentRoom + '/messages').push({
                sender: myName,
                text: text,
                timestamp: Date.now()
            });
            input.value = '';
        }

        function renderChat() {
            if (!roomData.messages) return;
            const msgs = Object.values(roomData.messages).sort((a, b) => a.timestamp - b.timestamp);
            
            if (msgs.length !== lastMessageCount) {
                lastMessageCount = msgs.length;
                let html = '';
                msgs.forEach(msg => {
                    const isMe = msg.sender === myName;
                    html += `
                        <div class="msg ${isMe ? 'me' : 'other'}">
                            ${msg.text}
                        </div>
                    `;
                });
                chatMessages.innerHTML = html;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

    </script>
