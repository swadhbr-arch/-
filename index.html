<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبدالرحيم الجياشي الشمري | البطاقة الرقمية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            background: #06070c;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.2rem;
            overflow-x: hidden;
            position: relative;
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            z-index: 0;
            pointer-events: none;
        }

        .orb1 {
            width: 420px;
            height: 420px;
            background: #4a6cf7;
            top: -120px;
            right: -100px;
            animation: floatOrb 12s infinite alternate ease-in-out;
        }

        .orb2 {
            width: 380px;
            height: 380px;
            background: #9b4dff;
            bottom: -140px;
            left: -90px;
            animation: floatOrb 15s infinite alternate-reverse ease-in-out;
        }

        .orb3 {
            width: 280px;
            height: 280px;
            background: #00d4ff;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.25;
            filter: blur(110px);
            animation: pulseOrb 8s infinite alternate ease-in-out;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.15); }
        }

        @keyframes pulseOrb {
            0% { opacity: 0.15; transform: translate(-50%, -50%) scale(0.9); }
            100% { opacity: 0.35; transform: translate(-50%, -50%) scale(1.2); }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 520px;
            width: 100%;
            animation: fadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-card {
            background: rgba(12, 16, 28, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 2.5rem;
            padding: 2.8rem 2rem 2.2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 25px 60px -15px rgba(0, 0, 0, 0.9),
                inset 0 1px 1px rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #4a6cf7, #9b4dff, transparent);
            border-radius: 50%;
            opacity: 0.8;
        }

        /* ===== الصورة/اللوجو ===== */
        .profile-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }

        .avatar-ring {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: conic-gradient(from 180deg, #4a6cf7, #9b4dff, #00d4ff, #4a6cf7);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spinRing 6s linear infinite;
            box-shadow: 0 0 35px rgba(74, 108, 247, 0.5);
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #0a0d18;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spinRingReverse 6s linear infinite;
            overflow: hidden;
        }

        @keyframes spinRingReverse {
            to { transform: rotate(-360deg); }
        }

        /* الصورة الشخصية - استبدل logo.png باسم صورتك */
        .avatar-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            animation: spinRingReverse 6s linear infinite; /* تثبيت الصورة أثناء دوران الحلقة */
        }

        /* بديل في حال عدم وجود صورة */
        .avatar-inner .fallback-icon {
            font-size: 3.8rem;
            background: linear-gradient(135deg, #6d94ff, #b18cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .name-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 900;
            margin-top: 1.5rem;
            letter-spacing: -0.3px;
            background: linear-gradient(120deg, #ffffff 20%, #a5b9ff 60%, #d0b3ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.4;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* علامة التوثيق بجانب الاسم */
        .verified-badge-name {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            background: #1d9bf0;
            border-radius: 50%;
            font-size: 0.85rem;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(29, 155, 240, 0.5);
        }

        .title-badge {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 0.6rem;
        }

        .title-badge span {
            background: rgba(74, 108, 247, 0.12);
            border: 1px solid rgba(100, 150, 255, 0.2);
            color: #9fb5ff;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .title-badge i {
            font-size: 0.7rem;
            color: #6d94ff;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 2rem 0 1.5rem;
            color: #5a6e91;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(120, 160, 255, 0.3), transparent);
        }

        .accounts-grid {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        .account-card {
            display: flex;
            align-items: center;
            padding: 1rem 1.4rem;
            border-radius: 1.4rem;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-decoration: none;
            color: inherit;
            transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .account-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(74, 108, 247, 0.08), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .account-card:hover::after {
            transform: translateX(100%);
        }

        .account-card:hover {
            background: rgba(74, 108, 247, 0.08);
            border-color: rgba(100, 150, 255, 0.25);
            transform: translateX(-6px) scale(1.01);
            box-shadow: 0 12px 30px -10px rgba(74, 108, 247, 0.35);
        }

        .platform-icon {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            margin-left: 1.1rem;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            position: relative;
        }

        .account-card:hover .platform-icon {
            transform: scale(1.08) rotate(-4deg);
        }

        .tiktok-icon {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(0, 242, 234, 0.15);
            border: 1px solid rgba(0, 242, 234, 0.2);
        }

        .insta-icon {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: #fff;
            box-shadow: 0 4px 15px rgba(220, 39, 67, 0.35);
        }

        .fb-icon {
            background: linear-gradient(135deg, #1877f2, #0c5dc7);
            color: #fff;
            box-shadow: 0 4px 15px rgba(24, 119, 242, 0.35);
        }

        .account-details {
            flex: 1;
            min-width: 0;
        }

        .account-title {
            font-size: 1rem;
            font-weight: 700;
            color: #eef2ff;
            margin-bottom: 0.15rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ===== علامة التوثيق الأزرق بجانب كل حساب ===== */
        .verified-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            background: #1d9bf0;
            border-radius: 50%;
            color: #fff;
            font-size: 0.6rem;
            flex-shrink: 0;
            box-shadow: 0 1px 4px rgba(29, 155, 240, 0.5);
            position: relative;
        }

        .verified-icon i {
            font-size: 0.55rem;
        }

        .account-username {
            font-size: 0.85rem;
            color: #7b8db0;
            font-weight: 400;
            direction: ltr;
            text-align: right;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .account-username i {
            font-size: 0.65rem;
            opacity: 0.6;
        }

        .arrow-icon {
            color: #4a6cf7;
            font-size: 0.9rem;
            margin-right: 0.6rem;
            opacity: 0.5;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .account-card:hover .arrow-icon {
            opacity: 1;
            transform: translateX(-4px);
        }

        .card-footer {
            margin-top: 2rem;
            text-align: center;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .footer-text {
            font-size: 0.8rem;
            color: #4d5f80;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .footer-text i {
            color: #4a6cf7;
            font-size: 0.75rem;
        }

        @media (max-width: 480px) {
            .glass-card {
                padding: 2rem 1.2rem 1.8rem;
                border-radius: 2rem;
            }

            .avatar-ring {
                width: 105px;
                height: 105px;
            }

            .avatar-inner .fallback-icon {
                font-size: 3rem;
            }

            .name-title {
                font-size: 1.55rem;
            }

            .account-card {
                padding: 0.85rem 1rem;
                border-radius: 1.1rem;
            }

            .platform-icon {
                width: 44px;
                height: 44px;
                font-size: 1.4rem;
                border-radius: 13px;
                margin-left: 0.8rem;
            }

            .account-title {
                font-size: 0.9rem;
            }

            .account-username {
                font-size: 0.75rem;
            }

            .title-badge span {
                font-size: 0.7rem;
                padding: 0.25rem 0.8rem;
            }

            .verified-badge-name {
                width: 22px;
                height: 22px;
                font-size: 0.75rem;
            }
        }

        @media (max-width: 360px) {
            .name-title {
                font-size: 1.3rem;
            }
            .account-username {
                font-size: 0.65rem;
            }
            .arrow-icon {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="glow-orb orb1"></div>
    <div class="glow-orb orb2"></div>
    <div class="glow-orb orb3"></div>

    <div class="container">
        <div class="glass-card">
            <!-- ===== الصورة الرمزية - استبدل logo.png باسم صورتك ===== -->
            <div class="profile-wrap">
                <div class="avatar-ring">
                    <div class="avatar-inner">
                        <!-- هنا ضع رابط صورتك من GitHub -->
                        <img src="logo.png" alt="شعار عبدالرحيم الجياشي الشمري" 
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <i class="fas fa-user-astronaut fallback-icon" style="display:none;"></i>
                    </div>
                </div>

                <!-- الاسم + علامة التوثيق -->
                <h1 class="name-title">
                    عبدالرحيم الجياشي الشمري
                    <span class="verified-badge-name" title="حساب موثق">
                        <i class="fas fa-check"></i>
                    </span>
                </h1>
                <div class="title-badge">
                    <span><i class="fas fa-certificate"></i> حسابات موثقة</span>
                    <span><i class="fas fa-star"></i> رسمي</span>
                </div>
            </div>

            <div class="divider">تواصل معي</div>

            <div class="accounts-grid">
                <!-- تيك توك + توثيق -->
                <a href="https://www.tiktok.com/@r_epd" target="_blank" rel="noopener noreferrer" class="account-card">
                    <div class="platform-icon tiktok-icon">
                        <i class="fab fa-tiktok"></i>
                    </div>
                    <div class="account-details">
                        <div class="account-title">
                            تيك توك
                            <span class="verified-icon" title="موثق"><i class="fas fa-check"></i></span>
                        </div>
                        <div class="account-username">
                            <span>@r_epd</span>
                            <i class="fas fa-arrow-up-right-from-square"></i>
                        </div>
                    </div>
                    <i class="fas fa-chevron-left arrow-icon"></i>
                </a>

                <!-- إنستغرام + توثيق -->
                <a href="https://www.instagram.com/alsamkark" target="_blank" rel="noopener noreferrer" class="account-card">
                    <div class="platform-icon insta-icon">
                        <i class="fab fa-instagram"></i>
                    </div>
                    <div class="account-details">
                        <div class="account-title">
                            إنستغرام
                            <span class="verified-icon" title="موثق"><i class="fas fa-check"></i></span>
                        </div>
                        <div class="account-username">
                            <span>@alsamkark</span>
                            <i class="fas fa-arrow-up-right-from-square"></i>
                        </div>
                    </div>
                    <i class="fas fa-chevron-left arrow-icon"></i>
                </a>

                <!-- فيسبوك + توثيق -->
                <a href="https://www.facebook.com/share/1CCY33nfm3/" target="_blank" rel="noopener noreferrer" class="account-card">
                    <div class="platform-icon fb-icon">
                        <i class="fab fa-facebook-f"></i>
                    </div>
                    <div class="account-details">
                        <div class="account-title">
                            فيسبوك
                            <span class="verified-icon" title="موثق"><i class="fas fa-check"></i></span>
                        </div>
                        <div class="account-username">
                            <span>facebook.com/share/1CCY33nfm3</span>
                            <i class="fas fa-arrow-up-right-from-square"></i>
                        </div>
                    </div>
                    <i class="fas fa-chevron-left arrow-icon"></i>
                </a>
            </div>

            <div class="card-footer">
                <div class="footer-text">
                    <i class="fas fa-shield-halved"></i>
                    جميع الحسابات رسمية وموثقة
                    <i class="fas fa-shield-halved"></i>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
