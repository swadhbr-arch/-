<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ساحة القتال النيون | Neon Arena</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg: #05050a; --panel: #12121a;
            --my-color: #00f3ff; --op-color: #ff0055; --gold: #ffcc00;
            --text-muted: #8892b0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100%; width: 100%; overflow: hidden; background-color: var(--bg); color: #fff;
        }

        .app-container {
            position: relative; width: 100%; max-width: 550px; height: 100dvh; 
            margin: 0 auto; display: flex; flex-direction: column;
            background: var(--bg); box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* تأثير الاهتزاز عند تلقي ضربة */
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* شريط حقوق المطور */
        .dev-banner {
            background: linear-gradient(90deg, rgba(0,243,255,0.1), rgba(255,0,85,0.1));
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-align: center; padding: 8px; font-size: 0.8rem; font-weight: 700;
            z-index: 10;
        }
        .dev-banner span { color: var(--my-color); font-size: 0.95rem; text-shadow: 0 0 10px rgba(0,243,255,0.5);}

        /* ===== الشاشات ===== */
        .screen { display: none; flex-direction: column; flex: 1; height: 100%; overflow-y: auto; }
        .screen.active { display: flex; }

        /* ===== 1. شاشة الدخول ===== */
        #authScreen { padding: 20px; justify-content: center; align-items: center; }
        
        .login-card {
            width: 100%; background: rgba(255,255,255,0.02); padding: 30px 20px; border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
        }

        .title { font-size: 2.2rem; color: #fff; font-weight: 900; margin-bottom: 5px; text-shadow: 0 0 20px rgba(255,255,255,0.3);}
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; }

        .input-group { margin-bottom: 15px; text-align: right; }
        .input-group label { display: block; color: #ccc; margin-bottom: 5px; font-weight: 700; font-size: 0.85rem;}
        .input-group input {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.4); color: #fff; font-size: 1rem; outline: none; text-align: center;
        }
        .input-group input:focus { border-color: var(--my-color); }

        .btn {
            padding: 14px; font-size: 1rem; font-weight: 900; color: #000; background: var(--my-color);
            border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:hover { box-shadow: 0 0 20px var(--my-color); transform: scale(1.02);}
        .btn-outline { background: transparent; color: var(--op-color); border: 2px solid var(--op-color); margin-top: 10px;}
        .btn-outline:hover { background: var(--op-color); color: #fff; box-shadow: 0 0 20px var(--op-color);}

        /* ===== 2. شاشة الانتظار ===== */
        #lobbyScreen { justify-content: center; align-items: center; text-align: center; padding: 20px;}
        .room-code { font-size: 3rem; font-weight: 900; color: var(--gold); letter-spacing: 8px; margin: 20px 0; text-shadow: 0 0 20px rgba(255,204,0,0.4);}
        .wait-text { color: var(--text-muted); font-size: 1rem; animation: pulse 1.5s infinite alternate;}
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

        /* ===== 3. شاشة القتال ===== */
        #gameScreen { background: #000; padding: 15px; display: none; flex-direction: column;}
        #gameScreen.active { display: flex; }

        /* شريط الصحة */
        .battle-header { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        
        .hp-container { width: 100%; }
        .hp-info { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
        .hp-bar-bg { width: 100%; height: 15px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .hp-bar-fill { height: 100%; transition: width 0.3s ease, background 0.3s; }
        
        .my-hp .hp-bar-fill { background: var(--my-color); box-shadow: 0 0 10px var(--my-color); }
        .op-hp .hp-bar-fill { background: var(--op-color); box-shadow: 0 0 10px var(--op-color); }

        /* الساحة (المقاتلين) */
        .arena {
            flex: 1; display: flex; justify-content: space-around; align-items: center;
            background: radial-gradient(circle at center, rgba(255,255,255,0.05) 0%, transparent 70%);
            position: relative;
        }
        
        .fighter {
            font-size: 5rem; text-align: center; transition: transform 0.2s;
            filter: drop-shadow(0 0 15px currentColor);
        }
        .fighter.me { color: var(--my-color); }
        .fighter.op { color: var(--op-color); transform: scaleX(-1); /* توجيه الخصم */ }

        /* تأثير الهجوم */
        .attack-anim-me { animation: dashRight 0.4s ease-out; }
        .attack-anim-op { animation: dashLeft 0.4s ease-out; }
        @keyframes dashRight { 0% { transform: translateX(0); } 50% { transform: translateX(50px) scale(1.2); } 100% { transform: translateX(0); } }
        @keyframes dashLeft { 0% { transform: scaleX(-1) translateX(0); } 50% { transform: scaleX(-1) translateX(50px) scale(1.2); } 100% { transform: scaleX(-1) translateX(0); } }

        /* سجل المعركة */
        .battle-log {
            height: 60px; background: rgba(255,255,255,0.05); border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            font-size: 0.9rem; font-weight: bold; text-align: center; padding: 0 10px;
            color: var(--gold); margin-bottom: 20px; border: 1px solid rgba(255,204,0,0.2);
        }

        /* أزرار الحركات */
        .actions-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
        }
        
        .action-btn {
            background: var(--panel); border: 2px solid rgba(255,255,255,0.1); border-radius: 15px;
            padding: 15px 5px; display: flex; flex-direction: column; align-items: center; gap: 5px;
            cursor: pointer; transition: 0.2s; color: #fff;
        }
        .action-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--my-color); }
        .action-btn:active { transform: scale(0.95); }
        .action-btn.disabled { opacity: 0.5; pointer-events: none; filter: grayscale(1); }
        
        .action-icon { font-size: 2rem; }
        .action-name { font-size: 0.8rem; font-weight: bold; }
        
        .btn-sword .action-icon { color: #ccc; }
        .btn-magic .action-icon { color: #a855f7; }
        .btn-heal .action-icon { color: #00ff66; }

        /* شاشة الفائز */
        .winner-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .winner-overlay.show { opacity: 1; pointer-events: auto; }
        .winner-title { font-size: 3rem; font-weight: 900; margin-bottom: 10px; }
        .win-color { color: var(--my-color); text-shadow: 0 0 20px var(--my-color); }
        .lose-color { color: var(--op-color); text-shadow: 0 0 20px var(--op-color); }
    </style>
</head>
<body>

    <div class="app-container" id="appWrapper">
        
        <!-- شريط حقوق المطور -->
        <div class="dev-banner">
            تطوير المبدع: <span>عبدالرحيم الجياشي الشمري</span>
        </div>

        <!-- 1. شاشة الدخول -->
        <div class="screen active" id="authScreen">
            <div class="login-card">
                <div class="title">ساحة القتال ⚔️</div>
                <div class="subtitle">تحدى صديقك في معركة حتى الموت!</div>
                
                <div class="input-group">
                    <label>اسم المقاتل:</label>
                    <input type="text" id="playerName" placeholder="اكتب اسمك..." maxlength="15">
                </div>
                
                <button class="btn" id="createRoomBtn"><i class="fas fa-plus"></i> إنشاء غرفة</button>
                
                <div style="text-align: center; margin: 15px 0; color: #555; font-weight:bold;">- أو -</div>
                
                <div class="input-group">
                    <label>كود الغرفة (للدخول):</label>
                    <input type="text" id="roomCodeInput" placeholder="مثال: A7B2" style="text-transform: uppercase;" maxlength="6">
                </div>
                <button class="btn btn-outline" id="joinRoomBtn"><i class="fas fa-sign-in-alt"></i> دخول المعركة</button>
            </div>
        </div>

        <!-- 2. شاشة الانتظار -->
        <div class="screen" id="lobbyScreen">
            <h2 style="color: #fff; margin-bottom: 10px;">غرفة المعركة</h2>
            <div class="room-code" id="displayRoomCode">----</div>
            <p class="wait-text" id="waitMsg">بانتظار انضمام الخصم...</p>
        </div>

        <!-- 3. شاشة القتال -->
        <div class="screen" id="gameScreen">
            
            <!-- شريط الصحة -->
            <div class="battle-header">
                <div class="hp-container op-hp">
                    <div class="hp-info">
                        <span id="opNameDisplay">الخصم</span>
                        <span id="opHpText">100 / 100</span>
                    </div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill" id="opHpBar" style="width: 100%"></div></div>
                </div>
                
                <div class="hp-container my-hp" style="margin-top: 10px;">
                    <div class="hp-info">
                        <span id="myNameDisplay">أنت</span>
                        <span id="myHpText">100 / 100</span>
                    </div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill" id="myHpBar" style="width: 100%"></div></div>
                </div>
            </div>

            <!-- الساحة -->
            <div class="arena" id="arena">
                <div class="fighter op" id="opFighter">😈</div>
                <div style="font-size: 1.5rem; font-weight: 900; color: #555;">VS</div>
                <div class="fighter me" id="myFighter">🤖</div>
            </div>

            <!-- سجل المعركة -->
            <div class="battle-log" id="battleLog">
                المعركة ستبدأ...
            </div>

            <!-- أزرار الحركات -->
            <div class="actions-grid" id="actionsGrid">
                <button class="action-btn btn-sword" onclick="makeMove('sword')">
                    <span class="action-icon"><i class="fas fa-khanda"></i></span>
                    <span class="action-name">سيف (15-20)</span>
                </button>
                <button class="action-btn btn-magic" onclick="makeMove('magic')">
                    <span class="action-icon"><i class="fas fa-meteor"></i></span>
                    <span class="action-name">سحر (25-40)</span>
                </button>
                <button class="action-btn btn-heal" onclick="makeMove('heal')">
                    <span class="action-icon"><i class="fas fa-medkit"></i></span>
                    <span class="action-name">علاج (15-25)</span>
                </button>
            </div>

            <!-- شاشة الفائز -->
            <div class="winner-overlay" id="winnerOverlay">
                <div class="winner-title" id="winnerTitle">لقد فزت! 🏆</div>
                <button class="btn" id="closeOverlayBtn" style="width: 200px;">العودة للغرفة</button>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // 1. إعدادات Firebase
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBQa9TnbuCCPqfnXY-T9t-uwag0J2WEnFI",
            authDomain: "arrahimm.firebaseapp.com",
            databaseURL: "https://arrahimm-default-rtdb.firebaseio.com/",
            projectId: "arrahimm",
            storageBucket: "arrahimm.firebasestorage.app",
            messagingSenderId: "150237867312",
            appId: "1:150237867312:web:364d67877f9ff4d2bbacf5"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        // ==========================================
        // 2. المتغيرات
        // ==========================================
        let myId = 'player_' + Math.floor(Math.random() * 10000);
        let myName = "";
        let currentRoom = "";
        let roomData = {};
        let myRole = ""; // 'p1' أو 'p2'
        
        // العناصر
        const appWrapper = document.getElementById('appWrapper');
        const authScreen = document.getElementById('authScreen');
        const lobbyScreen = document.getElementById('lobbyScreen');
        const gameScreen = document.getElementById('gameScreen');
        const winnerOverlay = document.getElementById('winnerOverlay');
        const battleLog = document.getElementById('battleLog');
        const actionsGrid = document.getElementById('actionsGrid');
        const myFighter = document.getElementById('myFighter');
        const opFighter = document.getElementById('opFighter');

        // الأصوات
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            if(type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            } else if(type === 'heal') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            } else if(type === 'win') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            }

            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }

        // ==========================================
        // 3. إنشاء ودخول الغرف
        // ==========================================
        document.getElementById('createRoomBtn').addEventListener('click', () => {
            myName = document.getElementById('playerName').value.trim();
            if (!myName) return alert("الرجاء كتابة اسمك أولاً");
            
            const code = Math.random().toString(36).substring(2, 6).toUpperCase();
            currentRoom = code;
            myRole = 'p1';
            
            db.ref('rooms/' + code).set({
                host: myId,
                status: 'waiting',
                turn: 'p1', // p1 يبدأ
                players: { 
                    p1: { id: myId, name: myName, hp: 100 },
                    p2: null 
                },
                winner: null
            }).then(() => enterLobby());
        });

        document.getElementById('joinRoomBtn').addEventListener('click', () => {
            myName = document.getElementById('playerName').value.trim();
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if (!myName) return alert("الرجاء كتابة اسمك أولاً");
            if (!code) return alert("الرجاء كتابة كود الغرفة");

            currentRoom = code;
            myRole = 'p2';
            
            db.ref('rooms/' + code).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    db.ref(`rooms/${code}/players/p2`).set({ id: myId, name: myName, hp: 100 });
                    enterLobby();
                } else {
                    alert("الغرفة غير موجودة.");
                }
            });
        });

        function enterLobby() {
            authScreen.classList.remove('active');
            lobbyScreen.classList.add('active');
            document.getElementById('displayRoomCode').textContent = currentRoom;
            listenToRoom();
        }

        // ==========================================
        // 4. الاستماع للغرفة
        // ==========================================
        function listenToRoom() {
            db.ref('rooms/' + currentRoom).on('value', (snapshot) => {
                roomData = snapshot.val();
                if (!roomData) return;

                // بدء اللعب عند دخول شخصين
                if (roomData.status === 'waiting' && roomData.players.p2) {
                    db.ref(`rooms/${currentRoom}`).update({ status: 'playing' });
                }

                if (roomData.status === 'playing' || roomData.status === 'finished') {
                    if (!gameScreen.classList.contains('active')) {
                        lobbyScreen.classList.remove('active');
                        gameScreen.classList.add('active');
                    }
                    updateGameUI();
                }
            });
        }

        // ==========================================
        // 5. تحديث واجهة القتال
        // ==========================================
        function updateGameUI() {
            const me = roomData.players[myRole];
            const op = roomData.players[myRole === 'p1' ? 'p2' : 'p1'];

            if (!me || !op) return;

            // تحديث الأسماء
            document.getElementById('myNameDisplay').textContent = me.name;
            document.getElementById('opNameDisplay').textContent = op.name;

            // تحديث شريط الصحة
            document.getElementById('myHpText').textContent = `${me.hp} / 100`;
            document.getElementById('opHpText').textContent = `${op.hp} / 100`;
            
            document.getElementById('myHpBar').style.width = `${Math.max(0, me.hp)}%`;
            document.getElementById('opHpBar').style.width = `${Math.max(0, op.hp)}%`;

            // تغيير اللون إذا كانت الصحة منخفضة
            document.getElementById('myHpBar').style.background = me.hp < 30 ? 'var(--op-color)' : 'var(--my-color)';
            document.getElementById('opHpBar').style.background = op.hp < 30 ? 'var(--my-color)' : 'var(--op-color)';

            // التحقق من الدور
            if (roomData.status === 'playing') {
                if (roomData.turn === myRole) {
                    battleLog.textContent = "دورك الآن! اختر حركتك ⚔️";
                    actionsGrid.classList.remove('disabled');
                    actionsGrid.style.pointerEvents = 'auto';
                } else {
                    battleLog.textContent = "انتظر دور الخصم... ⏳";
                    actionsGrid.classList.add('disabled');
                    actionsGrid.style.pointerEvents = 'none';
                }
            }

            // التحقق من الفائز
            if (roomData.winner) {
                showResults(roomData.winner === myRole);
            }
        }

        // ==========================================
        // 6. تنفيذ الحركات
        // ==========================================
        function makeMove(type) {
            if (roomData.turn !== myRole || roomData.status !== 'playing') return;

            const me = roomData.players[myRole];
            const opRole = myRole === 'p1' ? 'p2' : 'p1';
            const op = roomData.players[opRole];

            let damage = 0;
            let heal = 0;
            let logMsg = "";

            if (type === 'sword') {
                damage = Math.floor(Math.random() * 6) + 15; // 15-20
                logMsg = `${me.name} سدد ضربة سيف! ⚔️ (-${damage} صحة)`;
            } else if (type === 'magic') {
                if (Math.random() < 0.2) {
                    logMsg = `${me.name} أطلق كرة سحرية... لكنها أخطأت! 💨`;
                } else {
                    damage = Math.floor(Math.random() * 16) + 25; // 25-40
                    logMsg = `${me.name} أطلق كرة سحرية قوية! 🔮 (-${damage} صحة)`;
                }
            } else if (type === 'heal') {
                heal = Math.floor(Math.random() * 11) + 15; // 15-25
                logMsg = `${me.name} استخدم العلاج! 💊 (+${heal} صحة)`;
            }

            // تأثيرات بصرية
            if (damage > 0) {
                playSound('hit');
                if (myRole === 'p1') {
                    myFighter.classList.add('attack-anim-me');
                    setTimeout(() => myFighter.classList.remove('attack-anim-me'), 400);
                } else {
                    myFighter.classList.add('attack-anim-op');
                    setTimeout(() => myFighter.classList.remove('attack-anim-op'), 400);
                }
                appWrapper.classList.add('shake');
                setTimeout(() => appWrapper.classList.remove('shake'), 400);
            } else if (heal > 0) {
                playSound('heal');
            }

            battleLog.textContent = logMsg;

            // تحديث الصحة في قاعدة البيانات
            let newMyHp = Math.min(100, me.hp + heal);
            let newOpHp = Math.max(0, op.hp - damage);

            const updates = {};
            updates[`rooms/${currentRoom}/players/${myRole}/hp`] = newMyHp;
            updates[`rooms/${currentRoom}/players/${opRole}/hp`] = newOpHp;
            
            // تغيير الدور
            updates[`rooms/${currentRoom}/turn`] = opRole;

            // التحقق من الفوز
            if (newOpHp <= 0) {
                updates[`rooms/${currentRoom}/status`] = 'finished';
                updates[`rooms/${currentRoom}/winner`] = myRole;
                playSound('win');
            }

            db.ref().update(updates);
        }

        // ==========================================
        // 7. النهاية والنتائج
        // ==========================================
        function showResults(isWinner) {
            if (!winnerOverlay.classList.contains('show')) {
                winnerOverlay.classList.add('show');
                const title = document.getElementById('winnerTitle');
                
                if (isWinner) {
                    title.textContent = "لقد فزت! 🏆";
                    title.className = "winner-title win-color";
                    if(navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
                } else {
                    title.textContent = "لقد خسرت! 💀";
                    title.className = "winner-title lose-color";
                }
            }
        }

        document.getElementById('closeOverlayBtn').addEventListener('click', () => {
            winnerOverlay.classList.remove('show');
            
            // إعادة تعيين اللعبة
            if (roomData.host === myId) {
                db.ref('rooms/' + currentRoom).update({
                    status: 'waiting',
                    turn: 'p1',
                    winner: null,
                    'players/p1/hp': 100,
                    'players/p2/hp': 100
                });
            } else {
                gameScreen.classList.remove('active');
                lobbyScreen.classList.add('active');
            }
        });

    </script>
</body>
</html>
