<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مبارزة الساموراي | Samurai Duel</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg: #0f172a; --panel: #1e293b; 
            --my-color: #00f3ff; --op-color: #ff0055; --gold: #ffcc00;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100%; width: 100%; overflow: hidden; background-color: var(--bg); color: #fff;
            background-image: radial-gradient(circle at center, rgba(0,243,255,0.05) 0%, transparent 70%);
        }

        /* تأثير الاهتزاز */
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .app-container {
            position: relative; width: 100%; max-width: 550px; height: 100dvh; 
            margin: 0 auto; display: flex; flex-direction: column;
            background: var(--bg); box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* شريط حقوق المطور */
        .dev-banner {
            background: linear-gradient(90deg, rgba(0,243,255,0.1), rgba(255,0,85,0.1));
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-align: center; padding: 6px; font-size: 0.75rem; font-weight: 700;
            z-index: 10; flex-shrink: 0;
        }
        .dev-banner span { color: var(--my-color); font-size: 0.85rem; text-shadow: 0 0 10px rgba(0,243,255,0.5);}

        /* ===== الشاشات ===== */
        .screen { display: none; flex-direction: column; flex: 1; height: 100%; overflow-y: auto; position: relative;}
        .screen.active { display: flex; }

        /* ===== 1. شاشة الدخول ===== */
        #authScreen { padding: 20px; justify-content: center; align-items: center; }
        .login-card {
            width: 100%; background: var(--panel); padding: 25px 20px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08); text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .title { font-size: 2rem; color: #fff; font-weight: 900; margin-bottom: 5px; }
        .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }

        .input-group { margin-bottom: 12px; text-align: right; }
        .input-group label { display: block; color: #ccc; margin-bottom: 5px; font-weight: 700; font-size: 0.8rem;}
        .input-group input {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3); color: #fff; font-size: 1rem; outline: none; text-align: center;
        }

        .btn {
            padding: 12px; font-size: 1rem; font-weight: 900; color: #000; background: var(--my-color);
            border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:hover { background: #fff; }
        .btn-outline { background: transparent; color: var(--op-color); border: 2px solid var(--op-color); margin-top: 10px;}

        /* ===== 2. شاشة الانتظار ===== */
        #lobbyScreen { justify-content: center; align-items: center; text-align: center; padding: 20px;}
        .room-code { font-size: 3rem; font-weight: 900; color: var(--gold); letter-spacing: 8px; margin: 15px 0; text-shadow: 0 0 20px rgba(255,204,0,0.4);}
        .wait-text { color: var(--text-muted); font-size: 0.95rem; animation: pulse 1.5s infinite alternate;}
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

        /* ===== 3. شاشة اللعب ===== */
        #gameScreen { background: #000; display: none; flex-direction: column; height: 100%; padding: 10px; overflow: hidden;}
        #gameScreen.active { display: flex; }

        /* --- قسم اللعبة (العلوي) --- */
        .game-section {
            flex: 1.2; display: flex; flex-direction: column; background: var(--panel);
            border-radius: 15px; padding: 10px; margin-bottom: 10px; position: relative; overflow: hidden;
        }

        /* أشرطة الصحة */
        .hp-box { width: 100%; margin-bottom: 10px; z-index: 2;}
        .hp-header { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: bold; margin-bottom: 3px; }
        .hp-bar-bg { width: 100%; height: 12px; background: rgba(0,0,0,0.6); border-radius: 10px; overflow: hidden; }
        .hp-bar-fill { height: 100%; transition: width 0.3s ease, background 0.3s; }
        
        .my-hp .hp-bar-fill { background: var(--my-color); box-shadow: 0 0 10px var(--my-color); float: right;}
        .op-hp .hp-bar-fill { background: var(--op-color); box-shadow: 0 0 10px var(--op-color); float: left;}

        .p1-color { color: var(--my-color); text-shadow: 0 0 5px var(--my-color);}
        .p2-color { color: var(--op-color); text-shadow: 0 0 5px var(--op-color);}

        /* الساحة (المقاتلين) */
        .arena {
            flex: 1; display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; position: relative;
        }

        /* خط الأرضية */
        .arena::after {
            content: ''; position: absolute; bottom: 20%; left: 5%; right: 5%; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }

        .fighter {
            font-size: 4rem; position: relative; z-index: 2;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
            transition: transform 0.1s;
        }
        .fighter.me { color: var(--my-color); transform: scaleX(-1); } /* توجيه المقاتل لليمين */
        .fighter.op { color: var(--op-color); }

        /* حركات القتال */
        .attack-me { animation: dashRight 0.3s ease-out; }
        .attack-op { animation: dashLeft 0.3s ease-out; }
        @keyframes dashRight { 0% { transform: scaleX(-1) translateX(0); } 50% { transform: scaleX(-1) translateX(50px) scale(1.2); } 100% { transform: scaleX(-1) translateX(0); } }
        @keyframes dashLeft { 0% { transform: translateX(0); } 50% { transform: translateX(50px) scale(1.2); } 100% { transform: translateX(0); } }

        /* سجل المعركة */
        .battle-log { 
            background: rgba(0,0,0,0.7); padding: 8px; border-radius: 8px; text-align: center; 
            font-weight: bold; color: var(--gold); font-size: 0.85rem; margin-top: auto;
            border: 1px solid rgba(255,204,0,0.2); z-index: 2; min-height: 40px;
        }

        /* أزرار الحركات */
        .actions-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; z-index: 2;
        }
        .action-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 10px 5px; display: flex; flex-direction: column; 
            align-items: center; gap: 4px; cursor: pointer; color: #fff; font-weight: bold;
        }
        .action-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
        .action-btn:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }
        .action-btn i { font-size: 1.3rem; }
        .action-btn span { font-size: 0.75rem; }
        
        .btn-sword i { color: #ccc; }
        .btn-kick i { color: #ffcc00; }
        .btn-heal i { color: #00ff66; }

        /* --- قسم الدردشة (السفلي) --- */
        .chat-section {
            flex: 0.8; display: flex; flex-direction: column;
            background: var(--panel); border-radius: 15px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05); min-height: 0; /* هام جداً لمنع تمدد الشاشة */
        }
        .chat-messages { flex: 1; padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .msg { padding: 6px 12px; border-radius: 12px; font-size: 0.8rem; max-width: 85%; word-break: break-word; }
        .msg.me { background: var(--my-color); color: #000; align-self: flex-end; border-bottom-right-radius: 2px;}
        .msg.other { background: #334155; color: #fff; align-self: flex-start; border-bottom-left-radius: 2px;}
        
        .chat-input { display: flex; gap: 5px; padding: 8px; background: rgba(0,0,0,0.3); flex-shrink: 0;}
        .chat-input input { flex: 1; border: none; background: transparent; color: #fff; outline: none; padding: 5px 10px; font-size: 0.9rem; min-width: 0;}
        .chat-input button { background: var(--my-color); border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; color: #000; flex-shrink: 0;}

        /* شاشة الفائز */
        .winner-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .winner-overlay.show { opacity: 1; pointer-events: auto; }
        .winner-title { font-size: 2.5rem; font-weight: 900; margin-bottom: 20px; }
        .win-color { color: var(--my-color); text-shadow: 0 0 20px var(--my-color); }
        .lose-color { color: var(--op-color); text-shadow: 0 0 20px var(--op-color); }
    </style>
</head>
<body>

    <div class="app-container" id="appWrapper">
        
        <div class="dev-banner">
            تطوير المبدع: <span>عبدالرحيم الجياشي الشمري</span>
        </div>

        <!-- 1. شاشة الدخول -->
        <div class="screen active" id="authScreen">
            <div class="login-card">
                <div class="title">مبارزة الساموراي ⚔️</div>
                <div class="subtitle">لعبة قتال سريعة وسلسة تعمل على جميع الأجهزة</div>
                
                <div class="input-group">
                    <label>اسم المقاتل:</label>
                    <input type="text" id="playerName" placeholder="اكتب اسمك..." maxlength="15">
                </div>
                
                <button class="btn" id="createRoomBtn"><i class="fas fa-plus"></i> إنشاء غرفة</button>
                
                <div style="text-align: center; margin: 10px 0; color: #555; font-weight:bold;">- أو -</div>
                
                <div class="input-group">
                    <label>كود الغرفة (للدخول):</label>
                    <input type="text" id="roomCodeInput" placeholder="مثال: A7B2" style="text-transform: uppercase;" maxlength="6">
                </div>
                <button class="btn btn-outline" id="joinRoomBtn"><i class="fas fa-sign-in-alt"></i> دخول المعركة</button>
            </div>
        </div>

        <!-- 2. شاشة الانتظار -->
        <div class="screen" id="lobbyScreen">
            <h2 style="color: #fff; margin-bottom: 10px;">غرفة المعركة</h2>
            <div class="room-code" id="displayRoomCode">----</div>
            <p class="wait-text" id="waitMsg">بانتظار انضمام الخصم...</p>
        </div>

        <!-- 3. شاشة اللعب -->
        <div class="screen" id="gameScreen">
            
            <!-- قسم اللعبة (العلوي) -->
            <div class="game-section">
                
                <!-- أشرطة الصحة -->
                <div class="hp-box op-hp">
                    <div class="hp-header">
                        <span class="p2-color" id="opName">الخصم</span>
                        <span id="opHpText">100 / 100</span>
                    </div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill" id="opHpBar" style="width: 100%"></div></div>
                </div>

                <!-- الساحة -->
                <div class="arena">
                    <div class="fighter op" id="opFighter">👹</div>
                    <div style="font-size: 1.2rem; font-weight: 900; color: #555; z-index:2;">VS</div>
                    <div class="fighter me" id="myFighter">🥷</div>
                </div>

                <!-- شريط صحتي -->
                <div class="hp-box my-hp">
                    <div class="hp-header">
                        <span class="p1-color" id="myName">أنت</span>
                        <span id="myHpText">100 / 100</span>
                    </div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill" id="myHpBar" style="width: 100%"></div></div>
                </div>

                <!-- سجل المعركة -->
                <div class="battle-log" id="battleLog">استعد للمعركة...</div>

                <!-- أزرار الحركات -->
                <div class="actions-grid">
                    <button class="action-btn btn-sword" onclick="performAction('sword')">
                        <i class="fas fa-khanda"></i> <span>سيف (10-20)</span>
                    </button>
                    <button class="action-btn btn-kick" onclick="performAction('kick')">
                        <i class="fas fa-shoe-prints"></i> <span>ركلة (15-25)</span>
                    </button>
                    <button class="action-btn btn-heal" onclick="performAction('heal')">
                        <i class="fas fa-medkit"></i> <span>علاج (15-20)</span>
                    </button>
                </div>
            </div>

            <!-- قسم الدردشة (السفلي) -->
            <div class="chat-section">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="اكتب رسالة..." autocomplete="off">
                    <button id="sendChatBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <!-- شاشة الفائز -->
            <div class="winner-overlay" id="winnerOverlay">
                <div class="winner-title" id="winnerTitle">لقد فزت! 🏆</div>
                <button class="btn" id="closeOverlayBtn" style="width: 200px;">العودة للغرفة</button>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // 1. إعدادات Firebase
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBQa9TnbuCCPqfnXY-T9t-uwag0J2WEnFI",
            authDomain: "arrahimm.firebaseapp.com",
            databaseURL: "https://arrahimm-default-rtdb.firebaseio.com/",
            projectId: "arrahimm",
            storageBucket: "arrahimm.firebasestorage.app",
            messagingSenderId: "150237867312",
            appId: "1:150237867312:web:364d67877f9ff4d2bbacf5"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        // ==========================================
        // 2. المتغيرات
        // ==========================================
        let myId = 'player_' + Math.floor(Math.random() * 10000);
        let myName = "";
        let currentRoom = "";
        let roomData = {};
        let myRole = ""; // 'p1' أو 'p2'
        
        let lastLogProcessed = "";
        let lastMessageCount = 0;

        // العناصر
        const appWrapper = document.getElementById('appWrapper');
        const authScreen = document.getElementById('authScreen');
        const lobbyScreen = document.getElementById('lobbyScreen');
        const gameScreen = document.getElementById('gameScreen');
        const winnerOverlay = document.getElementById('winnerOverlay');
        const battleLog = document.getElementById('battleLog');
        const chatMessages = document.getElementById('chatMessages');
        const myFighter = document.getElementById('myFighter');
        const opFighter = document.getElementById('opFighter');

        // الأصوات
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            if(type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            } else if(type === 'heal') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            } else if(type === 'win') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            }

            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        // ==========================================
        // 3. إنشاء ودخول الغرف
        // ==========================================
        document.getElementById('createRoomBtn').addEventListener('click', () => {
            myName = document.getElementById('playerName').value.trim();
            if (!myName) return alert("الرجاء كتابة اسمك أولاً");
            
            const code = Math.random().toString(36).substring(2, 6).toUpperCase();
            currentRoom = code;
            myRole = 'p1';
            
            db.ref('samurai/' + code).set({
                host: myId,
                status: 'waiting',
                p1_hp: 100, p2_hp: 100,
                turn: 'p1',
                players: { 
                    p1: { name: myName },
                    p2: null 
                },
                lastLog: "استعد للمعركة! ⚔️",
                winner: null
            }).then(() => enterLobby());
        });

        document.getElementById('joinRoomBtn').addEventListener('click', () => {
            myName = document.getElementById('playerName').value.trim();
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if (!myName) return alert("الرجاء كتابة اسمك أولاً");
            if (!code) return alert("الرجاء كتابة كود الغرفة");

            currentRoom = code;
            myRole = 'p2';
            
            db.ref('samurai/' + code).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    db.ref(`samurai/${code}/players/p2`).set({ name: myName });
                    enterLobby();
                } else {
                    alert("الغرفة غير موجودة.");
                }
            });
        });

        function enterLobby() {
            authScreen.classList.remove('active');
            lobbyScreen.classList.add('active');
            document.getElementById('displayRoomCode').textContent = currentRoom;
            listenToRoom();
        }

        // ==========================================
        // 4. الاستماع للغرفة
        // ==========================================
        function listenToRoom() {
            db.ref('samurai/' + currentRoom).on('value', (snapshot) => {
                roomData = snapshot.val();
                if (!roomData) return;

                if (roomData.status === 'waiting' && roomData.players.p2) {
                    db.ref(`samurai/${currentRoom}`).update({ status: 'playing' });
                }

                if (roomData.status === 'playing' || roomData.status === 'finished') {
                    if (!gameScreen.classList.contains('active')) {
                        lobbyScreen.classList.remove('active');
                        gameScreen.classList.add('active');
                    }
                    updateUI();
                    renderChat();
                }
            });
        }

        // ==========================================
        // 5. تحديث واجهة اللعب
        // ==========================================
        function updateUI() {
            const me = roomData.players[myRole];
            const opRole = myRole === 'p1' ? 'p2' : 'p1';
            const op = roomData.players[opRole];

            if (!me || !op) return;

            document.getElementById('myName').textContent = me.name;
            document.getElementById('opName').textContent = op.name;

            let myHp = Math.max(0, roomData[`${myRole}_hp`]);
            let opHp = Math.max(0, roomData[`${opRole}_hp`]);

            document.getElementById('myHpText').textContent = `${myHp} / 100`;
            document.getElementById('opHpText').textContent = `${opHp} / 100`;
            
            document.getElementById('myHpBar').style.width = `${myHp}%`;
            document.getElementById('opHpBar').style.width = `${opHp}%`;

            // تغيير اللون للتحذير
            if (myHp <= 30) document.getElementById('myHpBar').style.background = 'var(--op-color)';
            else document.getElementById('myHpBar').style.background = 'var(--my-color)';
            
            if (opHp <= 30) document.getElementById('opHpBar').style.background = 'var(--my-color)';
            else document.getElementById('opHpBar').style.background = 'var(--op-color)';

            battleLog.textContent = roomData.lastLog || "المعركة مستمرة...";

            // تأثيرات بصرية
            if (roomData.lastLog !== lastLogProcessed) {
                lastLogProcessed = roomData.lastLog;
                
                if (roomData.lastLog.includes('سدد') || roomData.lastLog.includes('ركل')) {
                    appWrapper.classList.add('shake');
                    setTimeout(() => appWrapper.classList.remove('shake'), 400);
                    playSound('hit');
                    
                    // حركة المقاتل
                    if (roomData.lastLog.includes(me.name)) {
                        myFighter.classList.add('attack-me');
                        setTimeout(() => myFighter.classList.remove('attack-me'), 300);
                    } else {
                        opFighter.classList.add('attack-op');
                        setTimeout(() => opFighter.classList.remove('attack-op'), 300);
                    }
                } else if (roomData.lastLog.includes('العلاج')) {
                    playSound('heal');
                }
            }

            // التحكم بالأزرار
            const isMyTurn = (roomData.turn === myRole);
            const btns = document.querySelectorAll('.action-btn');

            if (roomData.winner) {
                btns.forEach(b => b.disabled = true);
                if (!winnerOverlay.classList.contains('show')) {
                    winnerOverlay.classList.add('show');
                    const isWinner = (roomData.winner === myRole);
                    document.getElementById('winnerTitle').textContent = isWinner ? "لقد فزت! 🏆" : "لقد خسرت! 💀";
                    document.getElementById('winnerTitle').className = `winner-title ${isWinner ? 'win-color' : 'lose-color'}`;
                    if (isWinner) playSound('win');
                }
            } else {
                btns.forEach(b => b.disabled = !isMyTurn);
            }
        }

        // ==========================================
        // 6. تنفيذ الحركات
        // ==========================================
        function performAction(action) {
            if (roomData.turn !== myRole || roomData.winner) return;

            const opRole = myRole === 'p1' ? 'p2' : 'p1';
            let myHp = roomData[`${myRole}_hp`];
            let opHp = roomData[`${opRole}_hp`];
            let logMsg = "";
            let updates = {};

            if (action === 'sword') {
                let dmg = Math.floor(Math.random() * 11) + 10; // 10-20
                opHp = Math.max(0, opHp - dmg);
                updates[`${opRole}_hp`] = opHp;
                logMsg = `${roomData.players[myRole].name} سدد ضربة سيف! ⚔️ (-${dmg})`;
            } else if (action === 'kick') {
                let dmg = Math.floor(Math.random() * 11) + 15; // 15-25
                opHp = Math.max(0, opHp - dmg);
                updates[`${opRole}_hp`] = opHp;
                logMsg = `${roomData.players[myRole].name} ركل خصمه بقوة! 🦵 (-${dmg})`;
            } else if (action === 'heal') {
                let heal = Math.floor(Math.random() * 6) + 15; // 15-20
                myHp = Math.min(100, myHp + heal);
                updates[`${myRole}_hp`] = myHp;
                logMsg = `${roomData.players[myRole].name} استخدم العلاج! 💊 (+${heal})`;
            }

            updates['turn'] = opRole;
            updates['lastLog'] = logMsg;

            if (opHp <= 0) {
                updates['winner'] = myRole;
                updates['status'] = 'finished';
            }

            db.ref('samurai/' + currentRoom).update(updates);
        }

        // ==========================================
        // 7. العودة (إعادة اللعب)
        // ==========================================
        document.getElementById('closeOverlayBtn').addEventListener('click', () => {
            winnerOverlay.classList.remove('show');
            if (roomData.host === myId) {
                db.ref('samurai/' + currentRoom).update({
                    status: 'playing',
                    p1_hp: 100, p2_hp: 100,
                    turn: 'p1',
                    winner: null,
                    lastLog: "معركة جديدة بدأت! ⚔️"
                });
            }
        });

        // ==========================================
        // 8. الدردشة
        // ==========================================
        document.getElementById('sendChatBtn').addEventListener('click', sendMessage);
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !currentRoom) return;
            
            db.ref('samurai/' + currentRoom + '/messages').push({
                sender: myName,
                text: text,
                timestamp: Date.now()
            });
            input.value = '';
        }

        function renderChat() {
            if (!roomData.messages) return;
            const msgs = Object.values(roomData.messages).sort((a, b) => a.timestamp - b.timestamp);
            
            if (msgs.length !== lastMessageCount) {
                lastMessageCount = msgs.length;
                let html = '';
                msgs.forEach(msg => {
                    const isMe = msg.sender === myName;
                    html += `
                        <div class="msg ${isMe ? 'me' : 'other'}">
                            ${msg.text}
                        </div>
                    `;
                });
                chatMessages.innerHTML = html;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

    </script>
</body>
</html>
