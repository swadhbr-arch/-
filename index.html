<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبدالرحيم الجياشي الشمري | الحسابات الرسمية</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            background: #05070e;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.2rem;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية مضيئة */
        .bg-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.35;
        }

        .glow-1 {
            width: 350px;
            height: 350px;
            background: #2b52ff;
            top: -50px;
            right: -50px;
        }

        .glow-2 {
            width: 350px;
            height: 350px;
            background: #8a2be2;
            bottom: -50px;
            left: -50px;
        }

        .main-container {
            position: relative;
            z-index: 2;
            max-width: 450px;
            width: 100%;
        }

        /* البطاقة */
        .profile-card {
            background: rgba(13, 17, 30, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 2.5rem 1.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* الصورة الثابتة */
        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* الحلقة الدوارة (خلف الصورة) */
        .avatar-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #2b52ff, #8a2be2, #00d4ff, #2b52ff);
            animation: rotateRing 4s linear infinite;
            z-index: 1;
            box-shadow: 0 0 20px rgba(43, 82, 255, 0.4);
        }

        @keyframes rotateRing {
            to { transform: rotate(360deg); }
        }

        /* الصورة نفسها - ثابتة لا تدور */
        .avatar-img {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            z-index: 2;
            border: 4px solid #0d111e;
            background: #0d111e;
        }

        /* ===== تناسق الاسم والتوثيق ===== */
        .name-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            margin-bottom: 0.5rem;
        }

        .user-name {
            font-size: 1.35rem;
            font-weight: 900;
            color: #ffffff;
            white-space: nowrap;
            letter-spacing: -0.5px;
        }

        /* علامة التوثيق */
        .verified-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: #1d9bf0;
            border-radius: 50%;
            color: #ffffff;
            font-size: 0.6rem;
            box-shadow: 0 0 10px rgba(29, 155, 240, 0.6);
            flex-shrink: 0;
        }

        /* الوصف */
        .profile-bio {
            font-size: 0.8rem;
            color: #8b9bb4;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.04);
            padding: 0.35rem 1rem;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 2rem;
        }

        /* الأزرار */
        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .social-link {
            display: flex;
            align-items: center;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 1.2rem;
            text-decoration: none;
            color: inherit;
            transition: 0.3s;
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        /* الأيقونات */
        .platform-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            margin-left: 0.8rem;
            flex-shrink: 0;
        }

        .icon-tiktok { background: #000; color: #fff; border: 1px solid #25f4ee; }
        .icon-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: #fff; }
        .icon-fb { background: #1877f2; color: #fff; }

        /* معلومات الحساب */
        .link-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .link-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #eef2ff;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .link-name .verified-sm {
            color: #1d9bf0;
            font-size: 0.8rem;
        }

        .link-handle {
            font-size: 0.75rem;
            color: #7b8db0;
            direction: ltr;
            text-align: right;
            width: 100%;
        }

        .arrow-right {
            color: #4a6cf7;
            font-size: 0.8rem;
            opacity: 0.4;
        }

        /* للشاشات الصغيرة جداً */
        @media (max-width: 360px) {
            .user-name { font-size: 1.15rem; }
            .verified-badge { width: 18px; height: 18px; font-size: 0.5rem; }
        }
    </style>
</head>
<body>

    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="main-container">
        <div class="profile-card">
            
            <!-- الصورة الثابتة مع الحلقة الدوارة -->
            <div class="avatar-container">
                <div class="avatar-ring"></div>
                <!-- تأكد من رفع صورة logo.png على جيت هوب -->
                <img src="logo.png" alt="عبدالرحيم الجياشي الشمري" class="avatar-img" onerror="this.src='https://ui-avatars.com/api/?name=عبدالرحيم&background=0D111E&color=fff&size=120'">
            </div>

            <!-- الاسم مع علامة التوثيق -->
            <div class="name-row">
                <h1 class="user-name">عبدالرحيم الجياشي الشمري</h1>
                <span class="verified-badge" title="حساب موثق">
                    <i class="fas fa-check"></i>
                </span>
            </div>

            <!-- الوصف -->
            <div class="profile-bio">
                <i class="fas fa-crown" style="color: #f7c844;"></i>
                الحساب الرسمي والموثق
            </div>

            <!-- الأزرار -->
            <div class="links-list">
                <!-- تيك توك -->
                <a href="https://www.tiktok.com/@r_epd" target="_blank" class="social-link">
                    <div class="platform-icon icon-tiktok"><i class="fab fa-tiktok"></i></div>
                    <div class="link-info">
                        <div class="link-name">تيك توك <i class="fas fa-circle-check verified-sm"></i></div>
                        <div class="link-handle">@r_epd</div>
                    </div>
                    <i class="fas fa-chevron-left arrow-right"></i>
                </a>

                <!-- انستغرام -->
                <a href="https://www.instagram.com/alsamkark" target="_blank" class="social-link">
                    <div class="platform-icon icon-insta"><i class="fab fa-instagram"></i></div>
                    <div class="link-info">
                        <div class="link-name">إنستغرام <i class="fas fa-circle-check verified-sm"></i></div>
                        <div class="link-handle">@alsamkark</div>
                    </div>
                    <i class="fas fa-chevron-left arrow-right"></i>
                </a>

                <!-- فيسبوك -->
                <a href="https://www.facebook.com/share/1CCY33nfm3/" target="_blank" class="social-link">
                    <div class="platform-icon icon-fb"><i class="fab fa-facebook-f"></i></div>
                    <div class="link-info">
                        <div class="link-name">فيسبوك <i class="fas fa-circle-check verified-sm"></i></div>
                        <div class="link-handle">facebook.com/share/1CCY33nfm3</div>
                    </div>
                    <i class="fas fa-chevron-left arrow-right"></i>
                </a>
            </div>

        </div>
    </div>
</body>
</html>
