<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ارسم وخمن | Draw & Guess</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg: #0f172a; --panel: #1e293b; 
            --p1: #00f3ff; --p2: #ff0055; --gold: #ffcc00;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100%; width: 100%; overflow: hidden; background-color: var(--bg); color: #fff;
        }

        .app-container {
            position: relative; width: 100%; max-width: 550px; height: 100dvh; 
            margin: 0 auto; display: flex; flex-direction: column;
            background: var(--bg); box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* شريط حقوق المطور */
        .dev-banner {
            background: linear-gradient(90deg, rgba(0,243,255,0.1), rgba(255,0,85,0.1));
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-align: center; padding: 6px; font-size: 0.75rem; font-weight: 700;
            z-index: 10; flex-shrink: 0;
        }
        .dev-banner span { color: var(--p1); font-size: 0.85rem; text-shadow: 0 0 10px rgba(0,243,255,0.5);}

        /* ===== الشاشات ===== */
        .screen { display: none; flex-direction: column; flex: 1; height: 100%; overflow-y: auto; position: relative;}
        .screen.active { display: flex; }

        /* ===== 1. شاشة الدخول ===== */
        #authScreen { padding: 20px; justify-content: center; align-items: center; }
        .login-card {
            width: 100%; background: var(--panel); padding: 25px 20px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08); text-align: center;
        }
        .title { font-size: 1.8rem; color: #fff; font-weight: 900; margin-bottom: 5px; }
        .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }

        .input-group { margin-bottom: 12px; text-align: right; }
        .input-group label { display: block; color: #ccc; margin-bottom: 5px; font-weight: 700; font-size: 0.8rem;}
        .input-group input {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3); color: #fff; font-size: 1rem; outline: none; text-align: center;
        }

        .btn {
            padding: 12px; font-size: 1rem; font-weight: 900; color: #000; background: var(--p1);
            border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-outline { background: transparent; color: var(--p2); border: 2px solid var(--p2); margin-top: 10px;}

        /* ===== 2. شاشة الانتظار ===== */
        #lobbyScreen { justify-content: center; align-items: center; text-align: center; padding: 20px;}
        .room-code { font-size: 3rem; font-weight: 900; color: var(--gold); letter-spacing: 8px; margin: 15px 0; text-shadow: 0 0 20px rgba(255,204,0,0.4);}
        .wait-text { color: var(--text-muted); font-size: 0.95rem; animation: pulse 1.5s infinite alternate;}
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

        /* ===== 3. شاشة اللعب ===== */
        #gameScreen { background: #000; display: none; flex-direction: column; height: 100%; padding: 8px; overflow: hidden;}
        #gameScreen.active { display: flex; }

        /* هيدر اللعبة */
        .game-header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--panel); padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; flex-shrink: 0;
        }
        .p-info { display: flex; flex-direction: column; align-items: center; }
        .p-name { font-size: 0.8rem; font-weight: 700; }
        .p-score { font-size: 1.1rem; font-weight: 900; }
        .p1-color { color: var(--p1); text-shadow: 0 0 10px var(--p1); }
        .p2-color { color: var(--p2); text-shadow: 0 0 10px var(--p2); }
        .round-info { font-size: 0.9rem; font-weight: 700; color: var(--gold); }

        /* اللوحة (الرسم) */
        .canvas-container {
            flex: 1; background: #fff; border-radius: 10px; overflow: hidden;
            position: relative; margin-bottom: 8px; box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }
        canvas { width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

        /* أدوات الرسم */
        .tools { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; }
        .tool-btn {
            background: #e2e8f0; border: none; width: 35px; height: 35px; border-radius: 8px;
            cursor: pointer; display: flex; justify-content: center; align-items: center; color: #333; font-size: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .tool-btn:active { background: #cbd5e1; }

        /* الدردشة والتخمين */
        .chat-section {
            flex: 0.5; display: flex; flex-direction: column;
            background: var(--panel); border-radius: 10px; overflow: hidden; flex-shrink: 0;
        }
        .chat-messages { flex: 1; padding: 5px 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .msg { padding: 4px 8px; border-radius: 8px; font-size: 0.75rem; max-width: 85%; }
        .msg.me { background: var(--p1); color: #000; align-self: flex-end; }
        .msg.other { background: #334155; color: #fff; align-self: flex-start; }
        .msg.system { background: transparent; color: var(--gold); align-self: center; font-weight: bold; font-size: 0.7rem;}
        
        .chat-input { display: flex; gap: 5px; padding: 5px; background: rgba(0,0,0,0.3); }
        .chat-input input { flex: 1; border: none; background: transparent; color: #fff; outline: none; padding: 5px 10px; font-size: 0.85rem;}
        .chat-input button { background: var(--p1); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; color: #000;}

        /* اختيار الكلمة */
        .word-overlay {
            position: absolute; inset: 0; background: rgba(15,23,42,0.95); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; padding: 20px; text-align: center; display: none;
        }
        .word-overlay.show { display: flex; }
        .word-title { font-size: 1.2rem; margin-bottom: 20px; color: var(--gold); }
        .word-btn {
            background: #fff; color: #000; padding: 15px; border-radius: 10px; font-size: 1.1rem;
            font-weight: bold; width: 100%; margin-bottom: 10px; border: none; cursor: pointer;
            transition: 0.2s;
        }
        .word-btn:hover { background: var(--p1); transform: scale(1.02); }

        /* شاشة الفائز بالجولة */
        .winner-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .winner-overlay.show { opacity: 1; pointer-events: auto; }
        .winner-title { font-size: 2rem; font-weight: 900; margin-bottom: 10px; text-align: center; color: var(--gold);}
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="dev-banner">
            تطوير المبدع: <span>عبدالرحيم الجياشي الشمري</span>
        </div>

        <!-- 1. شاشة الدخول -->
        <div class="screen active" id="authScreen">
            <div class="login-card">
                <div class="title">ارسم وخمن 🎨</div>
                <div class="subtitle">ارسم الكلمة الغريبة ودع صديقك يخمنها!</div>
                
                <div class="input-group">
                    <label>اسمك:</label>
                    <input type="text" id="playerName" placeholder="اكتب اسمك..." maxlength="15">
                </div>
                
                <button class="btn" id="createRoomBtn"><i class="fas fa-plus"></i> إنشاء غرفة</button>
                
                <div style="text-align: center; margin: 10px 0; color: #555; font-weight:bold;">- أو -</div>
                
                <div class="input-group">
                    <label>كود الغرفة (للدخول):</label>
                    <input type="text" id="roomCodeInput" placeholder="مثال: A7B2" style="text-transform: uppercase;" maxlength="6">
                </div>
                <button class="btn btn-outline" id="joinRoomBtn"><i class="fas fa-sign-in-alt"></i> دخول الغرفة</button>
            </div>
        </div>

        <!-- 2. شاشة الانتظار -->
        <div class="screen" id="lobbyScreen">
            <h2 style="color: #fff; margin-bottom: 10px;">غرفة الانتظار</h2>
            <div class="room-code" id="displayRoomCode">----</div>
            <p class="wait-text" id="waitMsg">بانتظار انضمام صديقك...</p>
        </div>

        <!-- 3. شاشة اللعب -->
        <div class="screen" id="gameScreen">
            
            <!-- الهيدر -->
            <div class="game-header">
                <div class="p-info">
                    <span class="p-name p2-color" id="opName">الخصم</span>
                    <span class="p-score p2-color" id="opScore">0</span>
                </div>
                <div class="round-info" id="roundDisplay">الجولة 1 / 5</div>
                <div class="p-info">
                    <span class="p-name p1-color" id="myName">أنت</span>
                    <span class="p-score p1-color" id="myScore">0</span>
                </div>
            </div>

            <!-- لوحة الرسم -->
            <div class="canvas-container" id="canvasContainer">
                <canvas id="gameCanvas"></canvas>
                <!-- أدوات الرسم (تظهر للرسام فقط) -->
                <div class="tools" id="drawingTools" style="display: none;">
                    <button class="tool-btn" id="clearBtn" title="مسح"><i class="fas fa-trash"></i></button>
                </div>
            </div>

            <!-- الدردشة -->
            <div class="chat-section">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="اكتب تخمينك هنا..." autocomplete="off">
                    <button id="sendChatBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <!-- شاشة اختيار الكلمة (للرسام) -->
            <div class="word-overlay" id="wordOverlay">
                <div class="word-title">اختر كلمة لترسمها:</div>
                <div id="wordOptionsContainer">
                    <!-- الأزرار ستظهر هنا -->
                </div>
            </div>

            <!-- شاشة الفائز بالجولة -->
            <div class="winner-overlay" id="winnerOverlay">
                <div class="winner-title" id="winnerTitle">لقد خمنتها!</div>
                <button class="btn" id="nextRoundBtn" style="width: 200px;">الجولة التالية</button>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // 1. إعدادات Firebase
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBQa9TnbuCCPqfnXY-T9t-uwag0J2WEnFI",
            authDomain: "arrahimm.firebaseapp.com",
            databaseURL: "https://arrahimm-default-rtdb.firebaseio.com/",
            projectId: "arrahimm",
            storageBucket: "arrahimm.firebasestorage.app",
            messagingSenderId: "150237867312",
            appId: "1:150237867312:web:364d67877f9ff4d2bbacf5"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        // ==========================================
        // 2. بنك الكلمات (عادي + غريب + ميمز)
        // ==========================================
        const wordsBank = [
            ["تفاحة", "سيارة", "شمس", "بيت", "قطة", "طائرة"],
            ["رجل يطير", "قطة تسبح", "بيتزا تطاردك", "وحش فضائي", "دماغ يفكر", "بطيخ يبكي"],
            ["سيجما", "مجسم مواي", "ضفدع حزين", "ميمر يضحك", "شخصية كرتونية", "نظارة شمسية"],
            ["حصان بجناحين", "برجر يمشي", "هاتف يغضب", "روبوت يحب", "ساحر يطبخ", "سفينة فضاء"]
        ];

        // ==========================================
        // 3. المتغيرات
        // ==========================================
        let myId = 'player_' + Math.floor(Math.random() * 10000);
        let myName = "";
        let currentRoom = "";
        let roomData = {};
        let myRole = ""; // 'p1' (Host) أو 'p2' (Guest)
        let isDrawer = false;
        let currentWordToDraw = "";
        
        const TOTAL_ROUNDS = 5;
        let currentRound = 1;

        // إعدادات الرسم
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentStroke = [];
        let allStrokes = [];

        // العناصر
        const authScreen = document.getElementById('authScreen');
        const lobbyScreen = document.getElementById('lobbyScreen');
        const gameScreen = document.getElementById('gameScreen');
        const winnerOverlay = document.getElementById('winnerOverlay');
        const wordOverlay = document.getElementById('wordOverlay');
        const chatMessages = document.getElementById('chatMessages');
        const drawingTools = document.getElementById('drawingTools');
        
        let lastMessageCount = 0;
        let lastStrokeCount = 0;

        // ==========================================
        // 4. إنشاء ودخول الغرف
        // ==========================================
        document.getElementById('createRoomBtn').addEventListener('click', () => {
            myName = document.getElementById('playerName').value.trim();
            if (!myName) return alert("الرجاء كتابة اسمك أولاً");
            
            const code = Math.random().toString(36).substring(2, 6).toUpperCase();
            currentRoom = code;
            myRole = 'p1';
            
            db.ref('rooms/' + code).set({
                host: myId,
                status: 'waiting',
                round: 1,
                turn: 'p1', // p1 يرسم أولاً
                players: { 
                    p1: { name: myName, score: 0 },
                    p2: null 
                },
                word: null,
                wordOptions: null,
                strokes: [],
                winner: null
            }).then(() => enterLobby());
        });

        document.getElementById('joinRoomBtn').addEventListener('click', () => {
            myName = document.getElementById('playerName').value.trim();
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if (!myName) return alert("الرجاء كتابة اسمك أولاً");
            if (!code) return alert("الرجاء كتابة كود الغرفة");

            currentRoom = code;
            myRole = 'p2';
            
            db.ref('rooms/' + code).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    db.ref(`rooms/${code}/players/p2`).set({ name: myName, score: 0 });
                    enterLobby();
                } else {
                    alert("الغرفة غير موجودة.");
                }
            });
        });

        function enterLobby() {
            authScreen.classList.remove('active');
            lobbyScreen.classList.add('active');
            document.getElementById('displayRoomCode').textContent = currentRoom;
            listenToRoom();
        }

        // ==========================================
        // 5. الاستماع للغرفة
        // ==========================================
        function listenToRoom() {
            db.ref('rooms/' + currentRoom).on('value', (snapshot) => {
                roomData = snapshot.val();
                if (!roomData) return;

                // بدء اللعب
                if (roomData.status === 'waiting' && roomData.players.p2) {
                    db.ref(`rooms/${currentRoom}`).update({ status: 'playing' });
                }

                if (roomData.status === 'playing') {
                    if (!gameScreen.classList.contains('active')) {
                        lobbyScreen.classList.remove('active');
                        gameScreen.classList.add('active');
                        resizeCanvas();
                    }
                    updateGameState();
                    renderChat();
                    renderCanvasFromFirebase();
                }
            });
        }

        // ==========================================
        // 6. إدارة الجولات والرسم
        // ==========================================
        function updateGameState() {
            // تحديث الأسماء والنقاط
            document.getElementById('myName').textContent = roomData.players[myRole].name;
            document.getElementById('myScore').textContent = roomData.players[myRole].score;
            document.getElementById('opName').textContent = roomData.players[myRole === 'p1' ? 'p2' : 'p1'].name;
            document.getElementById('opScore').textContent = roomData.players[myRole === 'p1' ? 'p2' : 'p1'].score;
            document.getElementById('roundDisplay').textContent = `الجولة ${roomData.round} / ${TOTAL_ROUNDS}`;

            isDrawer = (roomData.turn === myRole);

            if (isDrawer) {
                drawingTools.style.display = 'flex';
                // إذا كان دوري ارسم ولم يتم اختيار كلمة بعد
                if (!roomData.word && !wordOverlay.classList.contains('show') && !roomData.winner) {
                    showWordOptions();
                }
            } else {
                drawingTools.style.display = 'none';
                wordOverlay.classList.remove('show');
            }

            // إذا كان هناك فائز بالجولة
            if (roomData.winner) {
                if (!winnerOverlay.classList.contains('show')) {
                    showRoundWinner();
                }
            } else {
                winnerOverlay.classList.remove('show');
            }
        }

        // إظهار خيارات الكلمات للرسام
        function showWordOptions() {
            const levelIndex = Math.floor((roomData.round - 1) / 2); // كل جولتين مستوى جديد
            const words = wordsBank[Math.min(levelIndex, wordsBank.length - 1)];
            
            // اختيار 3 كلمات عشوائية
            const shuffled = [...words].sort(() => 0.5 - Math.random()).slice(0, 3);
            
            const container = document.getElementById('wordOptionsContainer');
            container.innerHTML = '';
            
            shuffled.forEach(word => {
                const btn = document.createElement('button');
                btn.className = 'word-btn';
                btn.textContent = word;
                btn.onclick = () => {
                    db.ref(`rooms/${currentRoom}/word`).set(word);
                    wordOverlay.classList.remove('show');
                    clearCanvas(); // مسح اللوحة لبدء الرسم
                    db.ref(`rooms/${currentRoom}/strokes`).set([]); // مسح الرسم في الداتابيز
                };
                container.appendChild(btn);
            });

            wordOverlay.classList.add('show');
        }

        // شاشة فوز الجولة
        function showRoundWinner() {
            winnerOverlay.classList.add('show');
            const title = document.getElementById('winnerTitle');
            
            const guesserRole = roomData.turn === 'p1' ? 'p2' : 'p1';
            const isMeGuesser = (guesserRole === myRole);
            
            title.textContent = isMeGuesser ? "لقد خمنتها! 🏆" : "لقد خمن صديقك! 🤝";
            
            if (roomData.winner === 'draw') {
                title.textContent = "انتهى الوقت! ⏳";
            } else {
                title.textContent = `الكلمة كانت: ${roomData.word}`;
            }

            // إظهار زر الجولة التالية للمضيف فقط
            document.getElementById('nextRoundBtn').style.display = (myRole === 'p1') ? 'block' : 'none';
        }

        // الانتقال للجولة التالية (للمضيف)
        document.getElementById('nextRoundBtn').addEventListener('click', () => {
            if (roomData.round >= TOTAL_ROUNDS) {
                alert("انتهت اللعبة! الفائز هو: " + (roomData.players.p1.score > roomData.players.p2.score ? roomData.players.p1.name : roomData.players.p2.name));
                window.location.reload();
            } else {
                const nextTurn = roomData.turn === 'p1' ? 'p2' : 'p1';
                db.ref('rooms/' + currentRoom).update({
                    round: roomData.round + 1,
                    turn: nextTurn,
                    word: null,
                    winner: null,
                    strokes: []
                });
                clearCanvas();
            }
        });

        // ==========================================
        // 7. التحقق من التخمين (في الدردشة)
        // ==========================================
        document.getElementById('sendChatBtn').addEventListener('click', sendMessage);
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !currentRoom) return;
            
            // إذا كان اللاعب مخمن (ليس الرسام) وهناك كلمة
            if (!isDrawer && roomData.word && !roomData.winner) {
                if (text.toLowerCase() === roomData.word.toLowerCase()) {
                    // إجابة صحيحة!
                    input.value = '';
                    
                    // حساب النقاط (المخمن يأخذ 10، الرسام يأخذ 5)
                    const guesserRole = myRole;
                    const drawerRole = myRole === 'p1' ? 'p2' : 'p1';
                    
                    let gScore = roomData.players[guesserRole].score + 10;
                    let dScore = roomData.players[drawerRole].score + 5;
                    
                    const updates = {};
                    updates[`rooms/${currentRoom}/players/${guesserRole}/score`] = gScore;
                    updates[`rooms/${currentRoom}/players/${drawerRole}/score`] = dScore;
                    updates[`rooms/${currentRoom}/winner`] = 'guessed';
                    
                    db.ref().update(updates);
                    
                    // إضافة رسالة في الدردشة
                    db.ref('rooms/' + currentRoom + '/messages').push({
                        sender: "النظام",
                        text: `${myName} خمن الكلمة بشكل صحيح! 🎉`,
                        isSystem: true
                    });
                    return;
                }
            }

            // إرسال رسالة عادية
            db.ref('rooms/' + currentRoom + '/messages').push({
                sender: myName,
                text: text,
                isSystem: false,
                timestamp: Date.now()
            });
            input.value = '';
        }

        function renderChat() {
            if (!roomData.messages) return;
            const msgs = Object.values(roomData.messages).sort((a, b) => a.timestamp - b.timestamp);
            
            if (msgs.length !== lastMessageCount) {
                lastMessageCount = msgs.length;
                let html = '';
                msgs.forEach(msg => {
                    if (msg.isSystem) {
                        html += `<div class="msg system">${msg.text}</div>`;
                    } else {
                        const isMe = msg.sender === myName;
                        html += `<div class="msg ${isMe ? 'me' : 'other'}">${msg.text}</div>`;
                    }
                });
                chatMessages.innerHTML = html;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        // ==========================================
        // 8. الرسم التفاعلي (Canvas)
        // ==========================================
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#000';
            redrawLocalCanvas();
        }

        window.addEventListener('resize', resizeCanvas);

        // إعدادات الرسم
        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            return { x: x / rect.width, y: y / rect.height }; // نحفظ الإحداثيات كنسبة مئوية
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!isDrawer || !roomData.word) return;
            isDrawing = true;
            currentStroke = [];
            const pos = getCoordinates(e);
            currentStroke.push(pos);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || !isDrawer) return;
            const pos = getCoordinates(e);
            currentStroke.push(pos);
            
            // رسم محلي فوري
            drawLine(currentStroke[currentStroke.length - 2], pos);
        });

        canvas.addEventListener('pointerup', () => {
            if (!isDrawing || !isDrawer) return;
            isDrawing = false;
            
            if (currentStroke.length > 1) {
                // حفظ الخط في الداتابيز
                db.ref(`rooms/${currentRoom}/strokes`).push(currentStroke);
                allStrokes.push(currentStroke);
                currentStroke = [];
            }
        });

        // رسم خط
        function drawLine(from, to) {
            ctx.beginPath();
            ctx.moveTo(from.x * canvas.width, from.y * canvas.height);
            ctx.lineTo(to.x * canvas.width, to.y * canvas.height);
            ctx.stroke();
        }

        // إعادة رسم اللوحة بالكامل (للمخمن)
        function renderCanvasFromFirebase() {
            if (isDrawer) return; // الرسام يرى رسمه المحلي
            
            if (roomData.strokes) {
                const currentStrokesCount = roomData.strokes.length;
                if (currentStrokesCount !== lastStrokeCount) {
                    lastStrokeCount = currentStrokesCount;
                    redrawLocalCanvas();
                }
            } else {
                if (lastStrokeCount !== 0) {
                    lastStrokeCount = 0;
                    clearCanvas();
                }
            }
        }

        // إعادة رسم الكانفاس من المصفوفة
        function redrawLocalCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (roomData.strokes) {
                roomData.strokes.forEach(stroke => {
                    if (!stroke || stroke.length < 2) return;
                    ctx.beginPath();
                    ctx.moveTo(stroke[0].x * canvas.width, stroke[0].y * canvas.height);
                    for (let i = 1; i < stroke.length; i++) {
                        ctx.lineTo(stroke[i].x * canvas.width, stroke[i].y * canvas.height);
                    }
                    ctx.stroke();
                });
            }
        }

        // مسح اللوحة
        document.getElementById('clearBtn').addEventListener('click', () => {
            if (!isDrawer) return;
            db.ref(`rooms/${currentRoom}/strokes`).set([]);
            allStrokes = [];
            clearCanvas();
        });

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

    </script>
</body>
</html>
